<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 225" role="img" aria-labelledby="title desc">
  <title id="title">From documents to training batches</title>
  <desc id="desc">Collect documents, filter and deduplicate, split by document, tokenize, pack and store token IDs, and load shifted input and target batches. Learn tokenizer merges on the training split and keep training and validation streams separate.</desc>
  <style>
    text { font-family: Inter, system-ui, sans-serif; text-anchor: middle; }
    .box { fill: #f3f8fb; stroke: #9fbfce; stroke-width: 2; }
    .title { fill: #16405a; font-size: 16px; font-weight: 700; }
    .sub { fill: #4b6372; font-size: 13px; }
    .arrow { stroke: #547384; stroke-width: 2; fill: #547384; }
    .foot { fill: #3c5a69; font-size: 14px; }
  </style>
  <rect x="0" y="0" width="1000" height="225" rx="10" fill="#fff"/>
  <rect class="box" x="12" y="40" width="140" height="95" rx="9"/>
  <text class="title" x="82" y="78">1. Collect</text><text class="sub" x="82" y="104">documents</text>
  <rect class="box" x="179" y="40" width="140" height="95" rx="9"/>
  <text class="title" x="249" y="76">2. Filter</text><text class="sub" x="249" y="103">deduplicate</text>
  <rect class="box" x="346" y="40" width="140" height="95" rx="9"/>
  <text class="title" x="416" y="76">3. Split</text><text class="sub" x="416" y="103">by document</text>
  <rect class="box" x="513" y="40" width="140" height="95" rx="9"/>
  <text class="title" x="583" y="76">4. Tokenize</text><text class="sub" x="583" y="103">text → IDs</text>
  <rect class="box" x="680" y="40" width="140" height="95" rx="9"/>
  <text class="title" x="750" y="76">5. Pack</text><text class="sub" x="750" y="103">store IDs</text>
  <rect class="box" x="847" y="40" width="140" height="95" rx="9"/>
  <text class="title" x="917" y="76">6. Batch</text><text class="sub" x="917" y="103">shift inputs/targets</text>
  <path class="arrow" d="M152 88H176M319 88H343M486 88H510M653 88H677M820 88H844"/>
  <path class="arrow" d="M176 88l-7 -4v8zM343 88l-7 -4v8zM510 88l-7 -4v8zM677 88l-7 -4v8zM844 88l-7 -4v8z"/>
  <text class="foot" x="500" y="181">Fit tokenizer on training documents · keep train and validation separate</text>
</svg>
