<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-labelledby="title desc">
  <title id="title">Causal self-attention mask</title>
  <desc id="desc">A lower-triangular five-token matrix. Teal cells are visible to a query; pale cells are future positions and are blocked.</desc>
  <style>
    text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.on{fill:#007f86}.off{fill:#f3f7fa;stroke:#d8e2e8;stroke-width:1}.label{fill:#10233f;font-size:18px;font-weight:700}.tick{fill:#526476;font-size:16px;font-weight:500}
    @media(prefers-color-scheme:dark){.on{fill:#225a60}.off{fill:#182534;stroke:#2c4052}.label{fill:#f3f7fa}.tick{fill:#b9c8d5}}
  </style>
  <text class="label" x="280" y="28" text-anchor="middle">key</text>
  <text class="label" x="72" y="172" text-anchor="middle" transform="rotate(-90 72 172)">query</text>
  <g transform="translate(150 48)">
    <text class="tick" x="24" y="-7" text-anchor="middle">0</text><text class="tick" x="74" y="-7" text-anchor="middle">1</text><text class="tick" x="124" y="-7" text-anchor="middle">2</text><text class="tick" x="174" y="-7" text-anchor="middle">3</text><text class="tick" x="224" y="-7" text-anchor="middle">4</text>
    <text class="tick" x="-22" y="31">0</text><text class="tick" x="-22" y="81">1</text><text class="tick" x="-22" y="131">2</text><text class="tick" x="-22" y="181">3</text><text class="tick" x="-22" y="231">4</text>
    <rect class="on" x="0" y="0" width="48" height="48" rx="4"/><rect class="off" x="50" y="0" width="48" height="48" rx="4"/><rect class="off" x="100" y="0" width="48" height="48" rx="4"/><rect class="off" x="150" y="0" width="48" height="48" rx="4"/><rect class="off" x="200" y="0" width="48" height="48" rx="4"/>
    <rect class="on" x="0" y="50" width="48" height="48" rx="4"/><rect class="on" x="50" y="50" width="48" height="48" rx="4"/><rect class="off" x="100" y="50" width="48" height="48" rx="4"/><rect class="off" x="150" y="50" width="48" height="48" rx="4"/><rect class="off" x="200" y="50" width="48" height="48" rx="4"/>
    <rect class="on" x="0" y="100" width="48" height="48" rx="4"/><rect class="on" x="50" y="100" width="48" height="48" rx="4"/><rect class="on" x="100" y="100" width="48" height="48" rx="4"/><rect class="off" x="150" y="100" width="48" height="48" rx="4"/><rect class="off" x="200" y="100" width="48" height="48" rx="4"/>
    <rect class="on" x="0" y="150" width="48" height="48" rx="4"/><rect class="on" x="50" y="150" width="48" height="48" rx="4"/><rect class="on" x="100" y="150" width="48" height="48" rx="4"/><rect class="on" x="150" y="150" width="48" height="48" rx="4"/><rect class="off" x="200" y="150" width="48" height="48" rx="4"/>
    <rect class="on" x="0" y="200" width="48" height="48" rx="4"/><rect class="on" x="50" y="200" width="48" height="48" rx="4"/><rect class="on" x="100" y="200" width="48" height="48" rx="4"/><rect class="on" x="150" y="200" width="48" height="48" rx="4"/><rect class="on" x="200" y="200" width="48" height="48" rx="4"/>
  </g>
</svg>
