<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 235" role="img" aria-labelledby="title desc">
  <title id="title">All-Gather Collective</title>
  <desc id="desc">Every rank begins with a local shard of size N/R. After all-gather, every rank holds the complete concatenated tensor of size N.</desc>
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" refX="8.5" refY="4" markerWidth="3.8" markerHeight="3.0" orient="auto">
      <path d="M0 1L8.5 4L0 7z" fill="#68798a"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .bg { fill: #f8fafc; stroke: #d8e2e8; stroke-width: 2; rx: 14; }
      .panel-title { fill: #10233f; font-size: 13.5px; font-weight: 750; }
      .rank-lbl { fill: #526071; font-size: 12px; font-weight: 650; }
      .cell-text { fill: #10233f; font-size: 12px; font-weight: 750; text-anchor: middle; }
      .cell-text-sm { fill: #10233f; font-size: 11px; font-weight: 750; text-anchor: middle; }
      .cell-border { stroke: #ffffff; stroke-width: 1.5; }
      .empty-slot { fill: #eef2f6; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 3 3; rx: 4; }
      .empty-text { fill: #94a3b8; font-size: 11px; font-weight: 500; text-anchor: middle; }
      .c0 { fill: #54c6cd; }
      .c1 { fill: #f59e0b; }
      .c2 { fill: #c084fc; }
      .c3 { fill: #fb7185; }
      .c0-light { fill: #bdecee; }
      .c1-light { fill: #fde68a; }
      .c2-light { fill: #e9d5ff; }
      .c3-light { fill: #fecdd3; }
      .flow { fill: none; stroke: #68798a; stroke-width: 2.5; marker-end: url(#arrow); }
      .api-lbl { fill: #007f86; font-size: 13px; font-weight: 700; text-anchor: middle; font-family: 'JetBrains Mono', monospace; }
      .meta-lbl { fill: #64748b; font-size: 11px; font-weight: 600; text-anchor: middle; }
      .meta-cost { fill: #ea580c; font-size: 11px; font-weight: 700; text-anchor: middle; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #131d2a; stroke: #2c4052; }
        .panel-title { fill: #f3f7fa; }
        .rank-lbl { fill: #94a3b8; }
        .cell-border { stroke: #131d2a; }
        .empty-slot { fill: #1e293b; stroke: #334155; }
        .empty-text { fill: #64748b; }
        .cell-text, .cell-text-sm { fill: #10233f; }
        .flow { stroke: #94a3b8; }
        .api-lbl { fill: #54d2d8; }
        .meta-lbl { fill: #94a3b8; }
        .meta-cost { fill: #fb923c; }
      }
    </style>
  </defs>
  <!-- Left: Initial State -->
  <rect class="bg" x="15" y="15" width="340" height="205"/>
  <text class="panel-title" x="35" y="42">Initial State (Local Shards [N/R])</text>

  <text class="rank-lbl" x="35" y="77">Rank 0</text>
  <rect class="c0 cell-border" x="95" y="62" width="55" height="22" rx="4"/><text class="cell-text" x="122" y="77">A</text>

  <text class="rank-lbl" x="35" y="117">Rank 1</text>
  <rect class="c1 cell-border" x="95" y="102" width="55" height="22" rx="4"/><text class="cell-text" x="122" y="117">B</text>

  <text class="rank-lbl" x="35" y="157">Rank 2</text>
  <rect class="c2 cell-border" x="95" y="142" width="55" height="22" rx="4"/><text class="cell-text" x="122" y="157">C</text>

  <text class="rank-lbl" x="35" y="197">Rank 3</text>
  <rect class="c3 cell-border" x="95" y="182" width="55" height="22" rx="4"/><text class="cell-text" x="122" y="197">D</text>

  <!-- Middle: Operation -->
  <path class="flow" d="M375 118 H475"/>
  <text class="api-lbl" x="425" y="96">all_gather</text>
  <text class="meta-lbl" x="425" y="142">Sends (R−1)/R · S</text>
  <text class="meta-lbl" x="425" y="158">Receives (R−1)/R · S</text>
  <text class="meta-cost" x="425" y="176">Total = (R − 1)S</text>

  <!-- Right: Final State -->
  <rect class="bg" x="495" y="15" width="350" height="205"/>
  <text class="panel-title" x="515" y="42">After All-Gather (Full Tensor [N])</text>

  <text class="rank-lbl" x="515" y="77">Rank 0</text>
  <g transform="translate(575, 62)">
    <rect class="c0 cell-border" x="0" y="0" width="60" height="22" rx="4"/><text class="cell-text" x="30" y="15">A</text>
    <rect class="c1 cell-border" x="60" y="0" width="60" height="22" rx="4"/><text class="cell-text" x="90" y="15">B</text>
    <rect class="c2 cell-border" x="120" y="0" width="60" height="22" rx="4"/><text class="cell-text" x="150" y="15">C</text>
    <rect class="c3 cell-border" x="180" y="0" width="60" height="22" rx="4"/><text class="cell-text" x="210" y="15">D</text>
  </g>

  <text class="rank-lbl" x="515" y="117">Rank 1</text>
  <g transform="translate(575, 102)">
    <rect class="c0 cell-border" x="0" y="0" width="60" height="22" rx="4"/><text class="cell-text" x="30" y="15">A</text>
    <rect class="c1 cell-border" x="60" y="0" width="60" height="22" rx="4"/><text class="cell-text" x="90" y="15">B</text>
    <rect class="c2 cell-border" x="120" y="0" width="60" height="22" rx="4"/><text class="cell-text" x="150" y="15">C</text>
    <rect class="c3 cell-border" x="180" y="0" width="60" height="22" rx="4"/><text class="cell-text" x="210" y="15">D</text>
  </g>

  <text class="rank-lbl" x="515" y="157">Rank 2</text>
  <g transform="translate(575, 142)">
    <rect class="c0 cell-border" x="0" y="0" width="60" height="22" rx="4"/><text class="cell-text" x="30" y="15">A</text>
    <rect class="c1 cell-border" x="60" y="0" width="60" height="22" rx="4"/><text class="cell-text" x="90" y="15">B</text>
    <rect class="c2 cell-border" x="120" y="0" width="60" height="22" rx="4"/><text class="cell-text" x="150" y="15">C</text>
    <rect class="c3 cell-border" x="180" y="0" width="60" height="22" rx="4"/><text class="cell-text" x="210" y="15">D</text>
  </g>

  <text class="rank-lbl" x="515" y="197">Rank 3</text>
  <g transform="translate(575, 182)">
    <rect class="c0 cell-border" x="0" y="0" width="60" height="22" rx="4"/><text class="cell-text" x="30" y="15">A</text>
    <rect class="c1 cell-border" x="60" y="0" width="60" height="22" rx="4"/><text class="cell-text" x="90" y="15">B</text>
    <rect class="c2 cell-border" x="120" y="0" width="60" height="22" rx="4"/><text class="cell-text" x="150" y="15">C</text>
    <rect class="c3 cell-border" x="180" y="0" width="60" height="22" rx="4"/><text class="cell-text" x="210" y="15">D</text>
  </g>
</svg>