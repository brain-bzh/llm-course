<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" role="img" aria-labelledby="title desc">
  <title id="title">Latency and bandwidth determine the best all-reduce algorithm</title>
  <desc id="desc">Communication time grows with a fixed startup latency plus a per-byte cost. A tree all-reduce has lower latency for small messages, while a ring all-reduce has a better bandwidth slope for large messages.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#68798a"/></marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.axis{stroke:#68798a;stroke-width:3;marker-end:url(#arrow)}.grid{stroke:#d8e2e8;stroke-width:1.5;stroke-dasharray:5 6}.tree{stroke:#ea580c;stroke-width:5;fill:none}.ring{stroke:#007f86;stroke-width:5;fill:none}.split{stroke:#68798a;stroke-width:2;stroke-dasharray:6 5}.shade-small{fill:#fff7ed;opacity:.75}.shade-large{fill:#e2f4f4;opacity:.75}.label{fill:#10233f;font-size:18px;font-weight:750}.sub{fill:#526071;font-size:13px;font-weight:500}.orange{fill:#ea580c;font-size:16px;font-weight:750}.teal{fill:#007f86;font-size:16px;font-weight:750}.formula{fill:#10233f;font-size:20px;font-weight:750}
      @media(prefers-color-scheme:dark){.grid{stroke:#2c4052}.shade-small{fill:#382015}.shade-large{fill:#173b40}.label,.formula{fill:#f3f7fa}.sub{fill:#9fb2c4}.tree{stroke:#fb923c}.ring{stroke:#54d2d8}.orange{fill:#fb923c}.teal{fill:#54d2d8}}
    </style>
  </defs>
  <path class="shade-small" d="M105 390V80H430V390Z"/><path class="shade-large" d="M430 390V80H835V390Z"/>
  <line class="grid" x1="105" y1="300" x2="835" y2="300"/><line class="grid" x1="105" y1="210" x2="835" y2="210"/><line class="grid" x1="105" y1="120" x2="835" y2="120"/>
  <line class="axis" x1="105" y1="390" x2="855" y2="390"/><line class="axis" x1="105" y1="390" x2="105" y2="60"/>
  <path class="tree" d="M110 348L790 88"/><path class="ring" d="M110 290L825 150"/>
  <line class="split" x1="430" y1="80" x2="430" y2="390"/>
  <text class="orange" x="805" y="120" text-anchor="end">tree: lower startup, steeper byte cost</text><text class="teal" x="805" y="214" text-anchor="end">ring: higher startup, better bandwidth use</text>
  <text class="label" x="268" y="365" text-anchor="middle">small messages</text><text class="label" x="635" y="365" text-anchor="middle">large messages</text>
  <text class="sub" x="268" y="344" text-anchor="middle">latency dominates</text><text class="sub" x="635" y="344" text-anchor="middle">bandwidth dominates</text>
  <text class="label" x="485" y="435" text-anchor="middle">message size m →</text><text class="label" x="28" y="230" text-anchor="middle" transform="rotate(-90 28 230)">communication time →</text>
  <text class="formula" x="500" y="45" text-anchor="middle">Tcomm(m) ≈ α + βm</text>
</svg>
