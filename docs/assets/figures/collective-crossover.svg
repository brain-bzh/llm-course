<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative all-reduce algorithm crossover</title>
  <desc id="desc">An illustrative graph of communication time against message size. The tree line starts lower and rises more steeply than the ring line. They cross; the tree is faster before the crossover and the ring after it. The result depends on the hardware and implementation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#647789"/></marker>
    <style>
      text {font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .bg {fill:#f2f7fa;stroke:#d4e1e8;stroke-width:2}.axis {stroke:#647789;stroke-width:3;marker-end:url(#arrow)}
      .grid {stroke:#cbd9e2;stroke-width:1.5;stroke-dasharray:5 6}.cross {stroke:#647789;stroke-width:2;stroke-dasharray:6 6}
      .tree {stroke:#d15a21;stroke-width:5;fill:none}.ring {stroke:#00868a;stroke-width:5;fill:none}
      .label {fill:#263e53;font-size:20px;font-weight:650}.legend {fill:#263e53;font-size:21px;font-weight:700}
      .small {fill:#526779;font-size:18px}.dot {fill:#263e53;stroke:#f2f7fa;stroke-width:3}
      @media(prefers-color-scheme:dark){.bg{fill:#192737;stroke:#354b5e}.grid{stroke:#3b5061}.label,.legend{fill:#eef6fb}.small{fill:#c5d5df}.tree{stroke:#ff9c61}.ring{stroke:#69d5d6}.axis,.cross{stroke:#a3b5c5}.dot{fill:#eef6fb;stroke:#192737}}
    </style>
  </defs>
  <rect class="bg" x="2" y="2" width="956" height="506" rx="10"/>
  <line class="tree" x1="150" y1="55" x2="195" y2="55"/><text class="legend" x="207" y="62">Tree</text>
  <line class="ring" x1="310" y1="55" x2="355" y2="55"/><text class="legend" x="367" y="62">Ring</text>
  <text class="small" x="844" y="62" text-anchor="end">Illustrative, not measured</text>
  <line class="grid" x1="155" y1="145" x2="850" y2="145"/>
  <line class="grid" x1="155" y1="235" x2="850" y2="235"/>
  <line class="grid" x1="155" y1="325" x2="850" y2="325"/>
  <line class="axis" x1="155" y1="400" x2="865" y2="400"/><line class="axis" x1="155" y1="400" x2="155" y2="100"/>
  <path class="tree" d="M155 370 L830 110"/><path class="ring" d="M155 312 L830 180"/>
  <line class="cross" x1="461" y1="400" x2="461" y2="252"/><circle class="dot" cx="461" cy="252" r="6"/>
  <text class="small" x="300" y="435" text-anchor="middle">Tree faster</text><text class="small" x="655" y="435" text-anchor="middle">Ring faster</text>
  <text class="label" x="505" y="475" text-anchor="middle">Message size</text>
  <text class="label" x="35" y="258" text-anchor="middle" transform="rotate(-90 35 258)">Communication time</text>
</svg>
