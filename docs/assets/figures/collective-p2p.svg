<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 160" role="img" aria-labelledby="title desc">
  <title id="title">Point-to-Point Communication (Send / Recv)</title>
  <desc id="desc">Direct point-to-point tensor transfer from a sender rank to a receiver rank.</desc>
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" refX="8.5" refY="4" markerWidth="3.8" markerHeight="3.0" orient="auto">
      <path d="M0 1L8.5 4L0 7z" fill="#68798a"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .bg { fill: #f8fafc; stroke: #d8e2e8; stroke-width: 2; rx: 14; }
      .panel-title { fill: #10233f; font-size: 13.5px; font-weight: 750; }
      .rank-lbl { fill: #526071; font-size: 12px; font-weight: 650; }
      .cell-text { fill: #10233f; font-size: 12px; font-weight: 750; text-anchor: middle; }
      .cell-border { stroke: #ffffff; stroke-width: 1.5; }
      .empty-slot { fill: #eef2f6; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 3 3; rx: 4; }
      .empty-text { fill: #526071; font-size: 11px; font-weight: 500; text-anchor: middle; }
      .c0 { fill: #54c6cd; }
      .flow { fill: none; stroke: #68798a; stroke-width: 2.5; marker-end: url(#arrow); }
      .api-lbl { fill: #007f86; font-size: 13px; font-weight: 700; text-anchor: middle; font-family: 'JetBrains Mono', monospace; }
      .meta-lbl { fill: #64748b; font-size: 11px; font-weight: 600; text-anchor: middle; }
      .meta-cost { fill: #b8481f; font-size: 11px; font-weight: 700; text-anchor: middle; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #131d2a; stroke: #2c4052; }
        .panel-title { fill: #f3f7fa; }
        .rank-lbl { fill: #94a3b8; }
        .cell-border { stroke: #131d2a; }
        .empty-slot { fill: #1e293b; stroke: #334155; }
        .empty-text { fill: #b8c9d8; }
        .cell-text { fill: #10233f; }
        .flow { stroke: #94a3b8; }
        .api-lbl { fill: #54d2d8; }
        .meta-lbl { fill: #94a3b8; }
        .meta-cost { fill: #fb923c; }
      }
    </style>
  </defs>
  <!-- Left: Sender -->
  <rect class="bg" x="25" y="15" width="330" height="130"/>
  <text class="panel-title" x="45" y="42">Sender (Rank i)</text>

  <text class="rank-lbl" x="45" y="82">Outbox Buffer</text>
  <rect class="c0 cell-border" x="150" y="66" width="180" height="26" rx="4"/><text class="cell-text" x="240" y="83">Tensor A [N]</text>
  <text class="meta-lbl" x="190" y="122">dist.isend(tensor, dst=j)</text>

  <!-- Middle: Operation -->
  <path class="flow" d="M375 79 H485"/>
  <text class="api-lbl" x="430" y="58">send ➔ recv</text>
  <text class="meta-cost" x="430" y="105">Payload = S bytes</text>

  <!-- Right: Receiver -->
  <rect class="bg" x="505" y="15" width="330" height="130"/>
  <text class="panel-title" x="525" y="42">Receiver (Rank j)</text>

  <text class="rank-lbl" x="525" y="82">Inbox Buffer</text>
  <rect class="c0 cell-border" x="630" y="66" width="180" height="26" rx="4"/><text class="cell-text" x="720" y="83">Tensor A [N]</text>
  <text class="meta-lbl" x="670" y="122">dist.irecv(tensor, src=i)</text>
</svg>