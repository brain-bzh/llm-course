<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
  <title id="title">Static batching compared with continuous batching</title>
  <desc id="desc">In a static batch, completed requests leave idle slots until the longest request ends. In continuous batching, the scheduler rebuilds each iteration and admits new requests as slots and cache blocks become available.</desc>
  <defs>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.panel{fill:#f3f7fa;stroke:#d8e2e8;stroke-width:2}.active{fill:#007f86}.prefill{fill:#ea580c}.idle{fill:#e5e7eb;stroke:#cbd5e1;stroke-width:1.5}.cell{stroke:#fff;stroke-width:2}.label{fill:#10233f;font-size:18px;font-weight:750}.sub{fill:#526071;font-size:12px;font-weight:500}.inverse{fill:#fff;font-size:13px;font-weight:750}.idletext{fill:#7a8795;font-size:12px;font-weight:650}.iteration{fill:#526071;font-size:11px;font-weight:650}.accent{fill:#ea580c;font-size:14px;font-weight:750}.teal{fill:#007f86;font-size:14px;font-weight:750}
      @media(prefers-color-scheme:dark){.panel{fill:#182534;stroke:#2c4052}.idle{fill:#253646;stroke:#40566a}.label{fill:#f3f7fa}.sub,.iteration{fill:#9fb2c4}.idletext{fill:#9fb2c4}.accent{fill:#fb923c}.teal{fill:#54d2d8}}
    </style>
  </defs>
  <rect class="panel" x="20" y="25" width="960" height="180" rx="16"/><rect class="panel" x="20" y="235" width="960" height="205" rx="16"/>
  <text class="label" x="45" y="58">Static batch</text><text class="sub" x="45" y="80">same request set until the longest sequence finishes</text>
  <text class="label" x="45" y="270">Continuous batch</text><text class="sub" x="45" y="292">rebuild the useful token set after every iteration</text>
  <g>
    <text class="iteration" x="330" y="100" text-anchor="middle">1</text><text class="iteration" x="410" y="100" text-anchor="middle">2</text><text class="iteration" x="490" y="100" text-anchor="middle">3</text><text class="iteration" x="570" y="100" text-anchor="middle">4</text><text class="iteration" x="650" y="100" text-anchor="middle">5</text><text class="iteration" x="730" y="100" text-anchor="middle">6</text><text class="iteration" x="810" y="100" text-anchor="middle">7</text><text class="iteration" x="890" y="100" text-anchor="middle">8</text>
    <text class="label" x="245" y="130" text-anchor="end">A</text><text class="label" x="245" y="164" text-anchor="end">B</text><text class="label" x="245" y="198" text-anchor="end">C</text>
    <rect class="active cell" x="290" y="112" width="80" height="28"/><rect class="active cell" x="370" y="112" width="80" height="28"/><rect class="active cell" x="450" y="112" width="80" height="28"/><rect class="idle" x="530" y="112" width="400" height="28"/><text class="idletext" x="730" y="131" text-anchor="middle">idle slot</text>
    <rect class="active cell" x="290" y="146" width="80" height="28"/><rect class="active cell" x="370" y="146" width="80" height="28"/><rect class="active cell" x="450" y="146" width="80" height="28"/><rect class="active cell" x="530" y="146" width="80" height="28"/><rect class="active cell" x="610" y="146" width="80" height="28"/><rect class="active cell" x="690" y="146" width="80" height="28"/><rect class="active cell" x="770" y="146" width="80" height="28"/><rect class="active cell" x="850" y="146" width="80" height="28"/>
    <rect class="active cell" x="290" y="180" width="80" height="20"/><rect class="active cell" x="370" y="180" width="80" height="20"/><rect class="idle" x="450" y="180" width="480" height="20"/><text class="idletext" x="690" y="196" text-anchor="middle">idle slot</text>
  </g>
  <g>
    <text class="iteration" x="330" y="318" text-anchor="middle">1</text><text class="iteration" x="410" y="318" text-anchor="middle">2</text><text class="iteration" x="490" y="318" text-anchor="middle">3</text><text class="iteration" x="570" y="318" text-anchor="middle">4</text><text class="iteration" x="650" y="318" text-anchor="middle">5</text><text class="iteration" x="730" y="318" text-anchor="middle">6</text><text class="iteration" x="810" y="318" text-anchor="middle">7</text><text class="iteration" x="890" y="318" text-anchor="middle">8</text>
    <text class="label" x="245" y="350" text-anchor="end">slot 1</text><text class="label" x="245" y="384" text-anchor="end">slot 2</text><text class="label" x="245" y="418" text-anchor="end">slot 3</text>
    <rect class="active cell" x="290" y="332" width="80" height="28"/><rect class="active cell" x="370" y="332" width="80" height="28"/><rect class="active cell" x="450" y="332" width="80" height="28"/><rect class="prefill cell" x="530" y="332" width="80" height="28"/><rect class="active cell" x="610" y="332" width="80" height="28"/><rect class="active cell" x="690" y="332" width="80" height="28"/><rect class="active cell" x="770" y="332" width="80" height="28"/><rect class="active cell" x="850" y="332" width="80" height="28"/>
    <rect class="active cell" x="290" y="366" width="80" height="28"/><rect class="active cell" x="370" y="366" width="80" height="28"/><rect class="active cell" x="450" y="366" width="80" height="28"/><rect class="active cell" x="530" y="366" width="80" height="28"/><rect class="active cell" x="610" y="366" width="80" height="28"/><rect class="active cell" x="690" y="366" width="80" height="28"/><rect class="active cell" x="770" y="366" width="80" height="28"/><rect class="active cell" x="850" y="366" width="80" height="28"/>
    <rect class="active cell" x="290" y="400" width="80" height="28"/><rect class="active cell" x="370" y="400" width="80" height="28"/><rect class="prefill cell" x="450" y="400" width="80" height="28"/><rect class="active cell" x="530" y="400" width="80" height="28"/><rect class="active cell" x="610" y="400" width="80" height="28"/><rect class="prefill cell" x="690" y="400" width="80" height="28"/><rect class="active cell" x="770" y="400" width="80" height="28"/><rect class="active cell" x="850" y="400" width="80" height="28"/>
    <text class="inverse" x="330" y="351" text-anchor="middle">A</text><text class="inverse" x="410" y="351" text-anchor="middle">A</text><text class="inverse" x="490" y="351" text-anchor="middle">A ✓</text><text class="inverse" x="570" y="351" text-anchor="middle">D prefill</text><text class="inverse" x="650" y="351" text-anchor="middle">D</text>
    <text class="inverse" x="330" y="385" text-anchor="middle">B</text><text class="inverse" x="890" y="385" text-anchor="middle">B</text>
    <text class="inverse" x="330" y="419" text-anchor="middle">C</text><text class="inverse" x="410" y="419" text-anchor="middle">C ✓</text><text class="inverse" x="490" y="419" text-anchor="middle">E prefill</text><text class="inverse" x="570" y="419" text-anchor="middle">E</text><text class="inverse" x="730" y="419" text-anchor="middle">F prefill</text>
  </g>
  <rect class="active" x="45" y="113" width="16" height="16" rx="3"/><text class="teal" x="70" y="126">decode token</text><rect class="prefill" x="135" y="113" width="16" height="16" rx="3"/><text class="accent" x="160" y="126">prefill chunk</text>
</svg>
