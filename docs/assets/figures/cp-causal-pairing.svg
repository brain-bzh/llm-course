<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="title desc"><title id="title">Causal work balancing with paired context chunks</title><desc id="desc">Eight causal query chunks are assigned across four GPUs. Contiguous adjacent chunks lead to illustrative valid-tile counts 3, 7, 11, and 15. Pairing early and late chunks gives nine tiles per GPU.</desc><defs><marker id="arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="6" markerHeight="5" orient="auto"><path d="M0 0L10 4L0 8z" fill="#667b8c"/></marker><marker id="purple" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="6" markerHeight="5" orient="auto"><path d="M0 0L10 4L0 8z" fill="#704cb2"/></marker><style>text{font-family:Inter,system-ui,sans-serif;fill:#173452;font-size:19px}.rank{font-size:20px;font-weight:700}.label{font-size:19px;font-weight:650}.small{font-size:16px;fill:#536a7d}.white{fill:#fff;font-weight:650}.panel{fill:#f2f6f9;stroke:#afc3d1;stroke-width:2}.blue{fill:#17406b;stroke:#17406b}.coral{fill:#d4562e;stroke:#d4562e}.blue-soft{fill:#dce7f1;stroke:#17406b}.coral-soft{fill:#f7e1d9;stroke:#b8481f}.absent{fill:none;stroke:#91a3b0;stroke-width:2;stroke-dasharray:6 5}.comm{fill:#f3effa;stroke:#704cb2;stroke-width:2}.flow{fill:none;stroke:#667b8c;stroke-width:2.5;marker-end:url(#arrow)}.network{fill:none;stroke:#704cb2;stroke-width:3;marker-end:url(#purple)}@media(prefers-color-scheme:dark){text{fill:#edf5fb}.small{fill:#c3d4df}.panel{fill:#263b4b;stroke:#7690a2}.blue-soft{fill:#294a68;stroke:#80b5d7}.coral-soft{fill:#654238;stroke:#f0a88c}.absent{stroke:#9bb0bf}.comm{fill:#403158;stroke:#c4a6ef}.flow{stroke:#b1c3d1}.network{stroke:#c4a6ef}}</style></defs><style>.rank0{fill:#17406b}.rank1{fill:#087b80}.rank2{fill:#9a5b00}.rank3{fill:#b8481f}.token{font-size:16px;fill:white;font-weight:700}</style><text class="rank" x="25" y="46" text-anchor="start">Contiguous</text><text class="rank" x="25" y="182" text-anchor="start">Paired</text><rect class="rank0" x="200" y="20" width="82" height="58"/><text class="token" x="241" y="56" text-anchor="middle">0</text><rect class="rank0" x="290" y="20" width="82" height="58"/><text class="token" x="331" y="56" text-anchor="middle">1</text><rect class="rank1" x="380" y="20" width="82" height="58"/><text class="token" x="421" y="56" text-anchor="middle">2</text><rect class="rank1" x="470" y="20" width="82" height="58"/><text class="token" x="511" y="56" text-anchor="middle">3</text><rect class="rank2" x="560" y="20" width="82" height="58"/><text class="token" x="601" y="56" text-anchor="middle">4</text><rect class="rank2" x="650" y="20" width="82" height="58"/><text class="token" x="691" y="56" text-anchor="middle">5</text><rect class="rank3" x="740" y="20" width="82" height="58"/><text class="token" x="781" y="56" text-anchor="middle">6</text><rect class="rank3" x="830" y="20" width="82" height="58"/><text class="token" x="871" y="56" text-anchor="middle">7</text><text class="small" x="255" y="113" text-anchor="middle">GPU 0: 3 tiles</text><text class="small" x="440" y="113" text-anchor="middle">GPU 1: 7 tiles</text><text class="small" x="625" y="113" text-anchor="middle">GPU 2: 11 tiles</text><text class="small" x="810" y="113" text-anchor="middle">GPU 3: 15 tiles</text><rect class="rank0" x="200" y="156" width="82" height="58"/><text class="token" x="241" y="192" text-anchor="middle">0</text><rect class="rank1" x="290" y="156" width="82" height="58"/><text class="token" x="331" y="192" text-anchor="middle">1</text><rect class="rank2" x="380" y="156" width="82" height="58"/><text class="token" x="421" y="192" text-anchor="middle">2</text><rect class="rank3" x="470" y="156" width="82" height="58"/><text class="token" x="511" y="192" text-anchor="middle">3</text><rect class="rank3" x="560" y="156" width="82" height="58"/><text class="token" x="601" y="192" text-anchor="middle">4</text><rect class="rank2" x="650" y="156" width="82" height="58"/><text class="token" x="691" y="192" text-anchor="middle">5</text><rect class="rank1" x="740" y="156" width="82" height="58"/><text class="token" x="781" y="192" text-anchor="middle">6</text><rect class="rank0" x="830" y="156" width="82" height="58"/><text class="token" x="871" y="192" text-anchor="middle">7</text><text class="small" x="255" y="249" text-anchor="middle">GPU 0: 9 tiles</text><text class="small" x="440" y="249" text-anchor="middle">GPU 1: 9 tiles</text><text class="small" x="625" y="249" text-anchor="middle">GPU 2: 9 tiles</text><text class="small" x="810" y="249" text-anchor="middle">GPU 3: 9 tiles</text><text class="small" x="25" y="313" text-anchor="start">Colors identify ranks; chunk numbers follow sequence order.</text></svg>
