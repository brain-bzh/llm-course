<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Ring all-reduce: two phase results</title>
  <desc id="desc">Four ranks arranged around a ring. After reduce-scatter each rank owns a different fully reduced chunk. After all-gather each rank has all four reduced chunks. Arrows indicate the communication direction, not individual steps.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#647789"/></marker>
    <style>
      text {font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .panel {fill:#f2f7fa;stroke:#d4e1e8;stroke-width:2}
      .node {fill:#10233f;stroke:#10233f;stroke-width:2}
      .edge {fill:none;stroke:#647789;stroke-width:3;marker-end:url(#arrow)}
      .heading {font-size:24px;font-weight:750;fill:#006f76}
      .rank {font-size:19px;font-weight:700;fill:white;text-anchor:middle}
      .key {font-size:19px;fill:#354b5e;text-anchor:middle}
      .a {fill:#00a8a8}.b {fill:#ed9b19}.c {fill:#9563d6}.d {fill:#e65d76}
      @media(prefers-color-scheme:dark){.panel{fill:#192737;stroke:#354b5e}.node{fill:#10233f;stroke:#62cdd0}.heading{fill:#6ad6d8}.key{fill:#d4e2ec}.edge{stroke:#a3b5c5}}
    </style>
  </defs>
  <rect class="panel" x="8" y="8" width="460" height="414" rx="10"/>
  <rect class="panel" x="492" y="8" width="460" height="414" rx="10"/>
  <text class="heading" x="238" y="51" text-anchor="middle">1 · Reduce-scatter</text>
  <text class="heading" x="722" y="51" text-anchor="middle">2 · All-gather</text>
  <g class="edge">
    <path d="M291 115 H355 V174"/><path d="M355 232 V298 H291"/>
    <path d="M185 298 H121 V236"/><path d="M121 174 V115 H181"/>
    <path d="M775 115 H839 V174"/><path d="M839 232 V298 H775"/>
    <path d="M669 298 H605 V236"/><path d="M605 174 V115 H665"/>
  </g>
  <g>
    <rect class="node" x="184" y="86" width="108" height="58" rx="6"/><text class="rank" x="238" y="111">Rank 0</text><rect class="a" x="214" y="122" width="48" height="10" rx="2"/>
    <rect class="node" x="301" y="174" width="108" height="58" rx="6"/><text class="rank" x="355" y="199">Rank 1</text><rect class="b" x="331" y="210" width="48" height="10" rx="2"/>
    <rect class="node" x="184" y="269" width="108" height="58" rx="6"/><text class="rank" x="238" y="294">Rank 2</text><rect class="c" x="214" y="305" width="48" height="10" rx="2"/>
    <rect class="node" x="67" y="174" width="108" height="58" rx="6"/><text class="rank" x="121" y="199">Rank 3</text><rect class="d" x="97" y="210" width="48" height="10" rx="2"/>
  </g>
  <g>
    <rect class="node" x="668" y="86" width="108" height="58" rx="6"/><text class="rank" x="722" y="111">Rank 0</text>
    <rect class="node" x="785" y="174" width="108" height="58" rx="6"/><text class="rank" x="839" y="199">Rank 1</text>
    <rect class="node" x="668" y="269" width="108" height="58" rx="6"/><text class="rank" x="722" y="294">Rank 2</text>
    <rect class="node" x="551" y="174" width="108" height="58" rx="6"/><text class="rank" x="605" y="199">Rank 3</text>
    <g transform="translate(690 122)"><rect class="a" width="13" height="10" rx="2"/><rect class="b" x="16" width="13" height="10" rx="2"/><rect class="c" x="32" width="13" height="10" rx="2"/><rect class="d" x="48" width="13" height="10" rx="2"/></g>
    <g transform="translate(807 210)"><rect class="a" width="13" height="10" rx="2"/><rect class="b" x="16" width="13" height="10" rx="2"/><rect class="c" x="32" width="13" height="10" rx="2"/><rect class="d" x="48" width="13" height="10" rx="2"/></g>
    <g transform="translate(690 305)"><rect class="a" width="13" height="10" rx="2"/><rect class="b" x="16" width="13" height="10" rx="2"/><rect class="c" x="32" width="13" height="10" rx="2"/><rect class="d" x="48" width="13" height="10" rx="2"/></g>
    <g transform="translate(573 210)"><rect class="a" width="13" height="10" rx="2"/><rect class="b" x="16" width="13" height="10" rx="2"/><rect class="c" x="32" width="13" height="10" rx="2"/><rect class="d" x="48" width="13" height="10" rx="2"/></g>
  </g>
  <text class="key" x="238" y="380">One reduced chunk per rank</text>
  <text class="key" x="722" y="380">All reduced chunks on every rank</text>
</svg>
