<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="title desc">
  <title id="title">Decoder-only Transformer</title>
  <desc id="desc">Tokens pass through an embedding stage, repeated causal attention and MLP blocks, and a language-model head to produce logits.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" refX="8.5" refY="4" markerWidth="3.8" markerHeight="3.0" orient="auto"><path d="M0 1L8.5 4L0 7z" fill="#68798a"/></marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.node{fill:#f3f7fa;stroke:#d8e2e8;stroke-width:2}.block{fill:#e2f4f4;stroke:#007f86;stroke-width:2}.core{fill:#10233f;stroke:#10233f;stroke-width:2}.flow{fill:none;stroke:#68798a;stroke-width:3;marker-end:url(#arrow)}.label{fill:#10233f;font-size:19px;font-weight:700}.inverse{fill:#fff;font-size:18px;font-weight:700}.repeat{fill:#007f86;font-size:16px;font-weight:700}
      @media(prefers-color-scheme:dark){.node{fill:#182534;stroke:#2c4052}.block{fill:#173b40;stroke:#54d2d8}.core{fill:#2c4052;stroke:#54d2d8}.label{fill:#f3f7fa}.repeat{fill:#54d2d8}}
    </style>
  </defs>
  <rect class="node" x="18" y="79" width="86" height="62" rx="9"/><text class="label" x="61" y="117" text-anchor="middle">Tokens</text>
  <path class="flow" d="M104 110H130"/>
  <rect class="core" x="134" y="70" width="116" height="80" rx="9"/><text class="inverse" x="192" y="102" text-anchor="middle">Embedding</text><text class="inverse" x="192" y="126" text-anchor="middle">+ position</text>
  <path class="flow" d="M250 110H274"/>
  <rect class="block" x="278" y="36" width="262" height="148" rx="14"/><text class="repeat" x="409" y="65" text-anchor="middle">× N</text>
  <rect class="core" x="298" y="84" width="106" height="58" rx="8"/><text class="inverse" x="351" y="108" text-anchor="middle">Causal</text><text class="inverse" x="351" y="130" text-anchor="middle">attention</text>
  <path class="flow" d="M404 113H434"/>
  <rect class="core" x="438" y="84" width="84" height="58" rx="8"/><text class="inverse" x="480" y="120" text-anchor="middle">MLP</text>
  <path class="flow" d="M540 110H564"/>
  <rect class="node" x="568" y="70" width="134" height="80" rx="9"/><text class="label" x="635" y="102" text-anchor="middle">LM head</text><text class="label" x="635" y="126" text-anchor="middle">→ logits</text>
</svg>
