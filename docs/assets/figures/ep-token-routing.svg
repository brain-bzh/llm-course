<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 365" role="img" aria-labelledby="title desc"><title id="title">Top-1 token routing across two experts</title><desc id="desc">GPU 0 starts with tokens a and b, GPU 1 with c and d. Expert 0 on GPU 0 processes a and d; expert 1 on GPU 1 processes b and c. b and d cross ranks.</desc><defs><marker id="arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="6" markerHeight="5" orient="auto"><path d="M0 0L10 4L0 8z" fill="#667b8c"/></marker><marker id="purple" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="6" markerHeight="5" orient="auto"><path d="M0 0L10 4L0 8z" fill="#704cb2"/></marker><style>text{font-family:Inter,system-ui,sans-serif;fill:#173452;font-size:19px}.rank{font-size:20px;font-weight:700}.label{font-size:19px;font-weight:650}.small{font-size:16px;fill:#536a7d}.white{fill:#fff;font-weight:650}.panel{fill:#f2f6f9;stroke:#afc3d1;stroke-width:2}.blue{fill:#17406b;stroke:#17406b}.coral{fill:#d4562e;stroke:#d4562e}.blue-soft{fill:#dce7f1;stroke:#17406b}.coral-soft{fill:#f7e1d9;stroke:#b8481f}.absent{fill:none;stroke:#91a3b0;stroke-width:2;stroke-dasharray:6 5}.comm{fill:#f3effa;stroke:#704cb2;stroke-width:2}.flow{fill:none;stroke:#667b8c;stroke-width:2.5;marker-end:url(#arrow)}.network{fill:none;stroke:#704cb2;stroke-width:3;marker-end:url(#purple)}@media(prefers-color-scheme:dark){text{fill:#edf5fb}.small{fill:#c3d4df}.panel{fill:#263b4b;stroke:#7690a2}.blue-soft{fill:#294a68;stroke:#80b5d7}.coral-soft{fill:#654238;stroke:#f0a88c}.absent{stroke:#9bb0bf}.comm{fill:#403158;stroke:#c4a6ef}.flow{stroke:#b1c3d1}.network{stroke:#c4a6ef}}</style></defs><style>.rank0{fill:#17406b}.rank1{fill:#087b80}.rank2{fill:#9a5b00}.rank3{fill:#b8481f}.token{font-size:16px;fill:white;font-weight:700}</style><rect class="panel" x="30" y="45" width="200" height="70"/><text class="label" x="130.0" y="74" text-anchor="middle">GPU 0 tokens</text><text class="small" x="130.0" y="98" text-anchor="middle">a, b</text><rect class="panel" x="30" y="235" width="200" height="70"/><text class="label" x="130.0" y="264" text-anchor="middle">GPU 1 tokens</text><text class="small" x="130.0" y="288" text-anchor="middle">c, d</text><rect class="blue-soft" x="710" y="45" width="220" height="70"/><text class="label" x="820.0" y="74" text-anchor="middle">GPU 0 · expert 0</text><text class="small" x="820.0" y="98" text-anchor="middle">process a, d</text><rect class="coral-soft" x="710" y="235" width="220" height="70"/><text class="label" x="820.0" y="264" text-anchor="middle">GPU 1 · expert 1</text><text class="small" x="820.0" y="288" text-anchor="middle">process b, c</text><path class="flow" d="M230 80 H705"/><path class="flow" d="M230 270 H705"/><path class="network" d="M230 90 L705 260"/><path class="network" d="M230 260 L705 90"/><text class="label" x="395" y="67" text-anchor="middle">a</text><text class="label" x="395" y="297" text-anchor="middle">c</text><text class="label" x="355" y="123" text-anchor="middle">b</text><text class="label" x="355" y="247" text-anchor="middle">d</text><text class="small" x="480" y="345" text-anchor="middle">Purple: remote dispatch · gray: local route</text></svg>
