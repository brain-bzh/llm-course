<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
  <title id="title">FineWeb selection funnel and evaluation loop</title>
  <desc id="desc">Common Crawl pages pass through extraction, base filters, per-snapshot deduplication, and optional educational selection. Each stage changes the surviving distribution, and controlled model training evaluates the full recipe.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#68798a"/></marker>
    <marker id="teal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#007f86"/></marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.source{fill:#10233f;stroke:#10233f;stroke-width:2}.stage{fill:#f3f7fa;stroke:#d8e2e8;stroke-width:2}.choice{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.target{fill:#e2f4f4;stroke:#007f86;stroke-width:2}.eval{fill:#007f86;stroke:#007f86;stroke-width:2}.flow{fill:none;stroke:#68798a;stroke-width:3;marker-end:url(#arrow)}.loop{fill:none;stroke:#007f86;stroke-width:3;stroke-dasharray:7 5;marker-end:url(#teal-arrow)}.label{fill:#10233f;font-size:17px;font-weight:750}.sub{fill:#526071;font-size:12px;font-weight:500}.inverse{fill:#fff;font-size:17px;font-weight:750}.inverse-sub{fill:#c5d3e0;font-size:12px;font-weight:500}.accent{fill:#9a3412;font-size:12px;font-weight:700}.note{fill:#007f86;font-size:13px;font-weight:700}
      @media(prefers-color-scheme:dark){.stage{fill:#182534;stroke:#2c4052}.choice{fill:#382015;stroke:#f97316}.target{fill:#173b40;stroke:#54d2d8}.eval{fill:#225a60;stroke:#54d2d8}.label{fill:#f3f7fa}.sub{fill:#9fb2c4}.accent{fill:#fdba74}.note{fill:#54d2d8}.loop{stroke:#54d2d8}}
    </style>
  </defs>
  <text class="label" x="35" y="35">The corpus is a sequence of explicit choices</text>
  <rect class="source" x="35" y="72" width="150" height="92" rx="12"/><text class="inverse" x="110" y="108" text-anchor="middle">Common Crawl</text><text class="inverse-sub" x="110" y="132" text-anchor="middle">WARC pages</text><text class="inverse-sub" x="110" y="149" text-anchor="middle">96 snapshots</text>
  <path class="flow" d="M185 118H220"/>
  <rect class="stage" x="225" y="72" width="150" height="92" rx="12"/><text class="label" x="300" y="106" text-anchor="middle">Extract</text><text class="sub" x="300" y="130" text-anchor="middle">main text</text><text class="sub" x="300" y="148" text-anchor="middle">+ language ID</text>
  <path class="flow" d="M375 118H410"/>
  <rect class="choice" x="415" y="72" width="150" height="92" rx="12"/><text class="label" x="490" y="106" text-anchor="middle">Filter</text><text class="sub" x="490" y="130" text-anchor="middle">quality, safety,</text><text class="sub" x="490" y="148" text-anchor="middle">repetition</text>
  <path class="flow" d="M565 118H600"/>
  <rect class="choice" x="605" y="72" width="150" height="92" rx="12"/><text class="label" x="680" y="106" text-anchor="middle">Deduplicate</text><text class="sub" x="680" y="130" text-anchor="middle">inside each</text><text class="sub" x="680" y="148" text-anchor="middle">crawl snapshot</text>
  <path class="flow" d="M755 118H790"/>
  <rect class="target" x="795" y="72" width="170" height="92" rx="12"/><text class="label" x="880" y="106" text-anchor="middle">Select</text><text class="sub" x="880" y="130" text-anchor="middle">FineWeb, optionally</text><text class="sub" x="880" y="148" text-anchor="middle">FineWeb-Edu</text>

  <path class="flow" d="M300 164V198"/><path class="flow" d="M490 164V198"/><path class="flow" d="M680 164V198"/><path class="flow" d="M880 164V198"/>
  <rect class="stage" x="225" y="203" width="150" height="62" rx="9"/><text class="accent" x="300" y="228" text-anchor="middle">lost formats</text><text class="sub" x="300" y="248" text-anchor="middle">+ boilerplate removed</text>
  <rect class="stage" x="415" y="203" width="150" height="62" rx="9"/><text class="accent" x="490" y="228" text-anchor="middle">threshold bias</text><text class="sub" x="490" y="248" text-anchor="middle">+ unsafe/noisy text</text>
  <rect class="stage" x="605" y="203" width="150" height="62" rx="9"/><text class="accent" x="680" y="228" text-anchor="middle">frequency changes</text><text class="sub" x="680" y="248" text-anchor="middle">+ repeated pages removed</text>
  <rect class="stage" x="795" y="203" width="170" height="62" rx="9"/><text class="accent" x="880" y="228" text-anchor="middle">targeted notion of value</text><text class="sub" x="880" y="248" text-anchor="middle">+ narrower coverage</text>

  <rect class="eval" x="260" y="330" width="205" height="78" rx="12"/><text class="inverse" x="362" y="361" text-anchor="middle">Token-matched training</text><text class="inverse-sub" x="362" y="384" text-anchor="middle">same model + optimizer budget</text>
  <path class="flow" d="M465 369H535"/>
  <rect class="target" x="540" y="330" width="205" height="78" rx="12"/><text class="label" x="642" y="361" text-anchor="middle">Downstream evidence</text><text class="sub" x="642" y="384" text-anchor="middle">utility, coverage, memorization</text>
  <path class="loop" d="M642 330V300H490V270"/><text class="note" x="570" y="296" text-anchor="middle">revise the recipe</text>
  <text class="sub" x="500" y="442" text-anchor="middle">The selector is validated by the model it produces—not by cleanliness alone.</text>
</svg>
