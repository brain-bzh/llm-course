44" rx="3"/><text class="" x="527.5" y="192.0">x₁</text><rect class="partial1" x="665" y="170" width="67" height="44" rx="3"/><text class="" x="698.5" y="192.0">f(x₁)</text><path class="flow" d="M560 192 L598 192"/><path class="flow" d="M732 192 L910 192"/><rect class="full" x="910" y="170" width="105" height="44" rx="3"/><text class="" x="962.5" y="192.0">f(x)</text><text class="muted" x="1005" y="80">same result</text><rect class="comm" x="252" y="381" width="142" height="50" rx="3"/><text class="" x="323.0" y="406.0">reduce-scatter</text><rect class="comm" x="744" y="381" width="128" height="50" rx="3"/><text class="" x="808.0" y="406.0">all-gather</text><text class="rank" x="45" y="373">GPU 0</text><rect class="full" x="98" y="351" width="112" height="44" rx="3"/><text class="" x="154.0" y="373.0">[p₀₀, p₀₁]</text><path class="flow" d="M210 373 L252 393"/><path class="flow" d="M394 393 L430 373"/><rect class="partial0" x="430" y="351" width="65" height="44" rx="3"/><text class="" x="462.5" y="373.0">x₀</text><rect class="partial1" x="598" y="351" width="67" height="44" rx="3"/><text class="" x="631.5" y="373.0">f(x₀)</text><rect class="absent" x="495" y="351" width="65" height="44" rx="3"/><text class="muted" x="527.5" y="373.0">x₁</text><rect class="absent" x="665" y="351" width="67" height="44" rx="3"/><text class="muted" x="698.5" y="373.0">f(x₁)</text><path class="flow" d="M560 373 L598 373"/><path class="flow" d="M732 373 L744 393"/><path class="flow" d="M872 393 L910 373"/><rect class="full" x="910" y="351" width="105" height="44" rx="3"/><text class="" x="962.5" y="373.0">f(x)</text><text class="rank" x="45" y="439">GPU 1</text><rect class="full" x="98" y="417" width="112" height="44" rx="3"/><text class="" x="154.0" y="439.0">[p₁₀, p₁₁]</text><path class="flow" d="M210 439 L252 419"/><path class="flow" d="M394 419 L430 439"/><rect class="absent" x="430" y="417" width="65" height="44" rx="3"/><text class="muted" x="462.5" y="439.0">x₀</text><rect class="a