<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">FSDP unit materialization lifecycle</title>
  <desc id="desc">A rank stores one parameter shard, all-gathers a full unit for forward, optionally reshares it, materializes it again for backward, reduce-scatters gradients, and updates only its local shard.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#68798a"/></marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.axis{stroke:#68798a;stroke-width:3;marker-end:url(#arrow)}.baseline{stroke:#d8e2e8;stroke-width:2}.resident{fill:#e2f4f4;stroke:#007f86;stroke-width:3}.transient{fill:#fff7ed;stroke:#ea580c;stroke-width:3}.action{fill:#f3f7fa;stroke:#d8e2e8;stroke-width:2}.collective{fill:#007f86;stroke:#007f86;stroke-width:2}.label{fill:#10233f;font-size:16px;font-weight:750}.sub{fill:#526071;font-size:12px;font-weight:500}.inverse{fill:#fff;font-size:14px;font-weight:750}.orange{fill:#ea580c;font-size:14px;font-weight:750}.teal{fill:#007f86;font-size:14px;font-weight:750}.dash{stroke:#68798a;stroke-width:1.5;stroke-dasharray:5 5}
      @media(prefers-color-scheme:dark){.baseline{stroke:#2c4052}.resident{fill:#173b40;stroke:#54d2d8}.transient{fill:#382015;stroke:#fb923c}.action{fill:#182534;stroke:#2c4052}.collective{fill:#225a60;stroke:#54d2d8}.label{fill:#f3f7fa}.sub{fill:#9fb2c4}.orange{fill:#fb923c}.teal{fill:#54d2d8}}
    </style>
  </defs>
  <text class="label" x="32" y="35">Parameter residency for one wrapped Transformer block</text>
  <line class="axis" x1="70" y1="230" x2="965" y2="230"/><text class="sub" x="965" y="250" text-anchor="end">time →</text>
  <line class="dash" x1="70" y1="95" x2="950" y2="95"/><text class="orange" x="58" y="100" text-anchor="end">full</text>
  <line class="dash" x1="70" y1="185" x2="950" y2="185"/><text class="teal" x="58" y="190" text-anchor="end">1 / D</text>
  <path class="resident" d="M80 185H190V95H360V185H520V95H700V185H940V230H80Z"/>
  <rect class="collective" x="128" y="272" width="125" height="54" rx="9"/><text class="inverse" x="190" y="296" text-anchor="middle">all-gather</text><text class="inverse" x="190" y="314" text-anchor="middle">parameters</text>
  <rect class="action" x="270" y="272" width="125" height="54" rx="9"/><text class="label" x="332" y="305" text-anchor="middle">forward</text>
  <rect class="transient" x="412" y="272" width="92" height="54" rx="9"/><text class="orange" x="458" y="296" text-anchor="middle">reshard</text><text class="sub" x="458" y="314" text-anchor="middle">optional</text>
  <rect class="collective" x="521" y="272" width="125" height="54" rx="9"/><text class="inverse" x="583" y="296" text-anchor="middle">all-gather</text><text class="inverse" x="583" y="314" text-anchor="middle">for backward</text>
  <rect class="action" x="663" y="272" width="115" height="54" rx="9"/><text class="label" x="720" y="305" text-anchor="middle">backward</text>
  <rect class="collective" x="795" y="272" width="135" height="54" rx="9"/><text class="inverse" x="862" y="296" text-anchor="middle">reduce-scatter</text><text class="inverse" x="862" y="314" text-anchor="middle">gradients</text>
  <line class="baseline" x1="190" y1="230" x2="190" y2="272"/><line class="baseline" x1="332" y1="230" x2="332" y2="272"/><line class="baseline" x1="458" y1="230" x2="458" y2="272"/><line class="baseline" x1="583" y1="230" x2="583" y2="272"/><line class="baseline" x1="720" y1="230" x2="720" y2="272"/><line class="baseline" x1="862" y1="230" x2="862" y2="272"/>
  <text class="sub" x="190" y="375" text-anchor="middle">remote shards arrive</text><text class="sub" x="458" y="375" text-anchor="middle">remote shards freed</text><text class="sub" x="862" y="375" text-anchor="middle">only local gradient shard remains</text>
  <text class="label" x="500" y="414" text-anchor="middle">Memory is saved because the full unit is transient—not because communication disappears.</text>
</svg>
