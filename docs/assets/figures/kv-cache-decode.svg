<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" role="img" aria-labelledby="title desc">
  <title id="title">One cached decode step</title>
  <desc id="desc">Past keys and values remain stored. The new token is projected into one query, one key, and one value. Its key and value append to the cache, while its query attends across all cached positions to produce the next output.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#68798a"/></marker>
    <marker id="teal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#007f86"/></marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.past{fill:#f3f7fa;stroke:#d8e2e8;stroke-width:2}.new{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.cache{fill:#e2f4f4;stroke:#007f86;stroke-width:2}.query{fill:#10233f;stroke:#10233f;stroke-width:2}.output{fill:#007f86;stroke:#007f86;stroke-width:2}.flow{fill:none;stroke:#68798a;stroke-width:3;marker-end:url(#arrow)}.attend{fill:none;stroke:#007f86;stroke-width:4;marker-end:url(#teal-arrow)}.label{fill:#10233f;font-size:17px;font-weight:750}.sub{fill:#526071;font-size:13px;font-weight:500}.inverse{fill:#fff;font-size:16px;font-weight:750}.accent{fill:#ea580c;font-size:15px;font-weight:750}.teal{fill:#007f86;font-size:15px;font-weight:750}
      @media(prefers-color-scheme:dark){.past{fill:#182534;stroke:#2c4052}.new{fill:#382015;stroke:#fb923c}.cache{fill:#173b40;stroke:#54d2d8}.query{fill:#2c4052;stroke:#54d2d8}.output{fill:#225a60;stroke:#54d2d8}.label{fill:#f3f7fa}.sub{fill:#9fb2c4}.accent{fill:#fb923c}.teal{fill:#54d2d8}.attend{stroke:#54d2d8}}
    </style>
  </defs>
  <text class="label" x="35" y="35">Past projections are reused; only the new token is projected</text>
  <rect class="past" x="35" y="76" width="330" height="82" rx="12"/><text class="label" x="200" y="106" text-anchor="middle">past tokens  x₁ … xₜ₋₁</text><text class="sub" x="200" y="132" text-anchor="middle">their K,V were computed in earlier steps</text>
  <rect class="new" x="35" y="205" width="145" height="78" rx="12"/><text class="accent" x="107" y="237" text-anchor="middle">new token xₜ</text><text class="sub" x="107" y="260" text-anchor="middle">one position</text>
  <path class="flow" d="M180 244H225"/>
  <rect class="query" x="230" y="190" width="95" height="52" rx="9"/><text class="inverse" x="277" y="222" text-anchor="middle">qₜ</text>
  <rect class="new" x="230" y="255" width="95" height="52" rx="9"/><text class="accent" x="277" y="287" text-anchor="middle">kₜ, vₜ</text>
  <path class="flow" d="M325 281H385"/>
  <rect class="cache" x="390" y="202" width="360" height="118" rx="13"/><text class="teal" x="570" y="228" text-anchor="middle">layer-local KV cache</text>
  <g><rect class="past" x="410" y="245" width="58" height="48" rx="7"/><text class="label" x="439" y="275" text-anchor="middle">K₁</text><rect class="past" x="474" y="245" width="58" height="48" rx="7"/><text class="label" x="503" y="275" text-anchor="middle">K₂</text><text class="sub" x="552" y="274">…</text><rect class="past" x="576" y="245" width="75" height="48" rx="7"/><text class="label" x="613" y="275" text-anchor="middle">Kₜ₋₁</text><rect class="new" x="657" y="245" width="72" height="48" rx="7"/><text class="accent" x="693" y="275" text-anchor="middle">Kₜ</text></g>
  <text class="sub" x="570" y="310" text-anchor="middle">V has the same append-only layout</text>
  <path class="attend" d="M277 190V128H570V198"/><text class="teal" x="432" y="119" text-anchor="middle">qₜ scans all visible K,V</text>
  <path class="flow" d="M750 261H805"/>
  <rect class="output" x="810" y="223" width="135" height="76" rx="12"/><text class="inverse" x="877" y="254" text-anchor="middle">attention oₜ</text><text class="inverse" x="877" y="278" text-anchor="middle">for one row</text>
  <text class="label" x="490" y="390" text-anchor="middle">The cache removes repeated K,V projection—not the linear scan over context.</text>
</svg>
