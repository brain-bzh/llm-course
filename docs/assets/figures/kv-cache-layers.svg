<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" role="img" aria-labelledby="title desc"><title id="title">Per-layer key-value cache grows with tokens</title><desc id="desc">Each layer stores key and value vectors for each cached token. A new token appends one key and one value vector per layer.</desc><defs><marker id="arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="6" markerHeight="5" orient="auto"><path d="M0 0L10 4L0 8z" fill="#667b8c"/></marker><marker id="purple" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="6" markerHeight="5" orient="auto"><path d="M0 0L10 4L0 8z" fill="#704cb2"/></marker><style>text{font-family:Inter,system-ui,sans-serif;fill:#173452;font-size:19px}.rank{font-size:20px;font-weight:700}.label{font-size:19px;font-weight:650}.small{font-size:16px;fill:#536a7d}.white{fill:#fff;font-weight:650}.panel{fill:#f2f6f9;stroke:#afc3d1;stroke-width:2}.blue{fill:#17406b;stroke:#17406b}.coral{fill:#d4562e;stroke:#d4562e}.blue-soft{fill:#dce7f1;stroke:#17406b}.coral-soft{fill:#f7e1d9;stroke:#b8481f}.absent{fill:none;stroke:#91a3b0;stroke-width:2;stroke-dasharray:6 5}.comm{fill:#f3effa;stroke:#704cb2;stroke-width:2}.flow{fill:none;stroke:#667b8c;stroke-width:2.5;marker-end:url(#arrow)}.network{fill:none;stroke:#704cb2;stroke-width:3;marker-end:url(#purple)}@media(prefers-color-scheme:dark){text{fill:#edf5fb}.small{fill:#c3d4df}.panel{fill:#263b4b;stroke:#7690a2}.blue-soft{fill:#294a68;stroke:#80b5d7}.coral-soft{fill:#654238;stroke:#f0a88c}.absent{stroke:#9bb0bf}.comm{fill:#403158;stroke:#c4a6ef}.flow{stroke:#b1c3d1}.network{stroke:#c4a6ef}}</style></defs><text class="label" x="70" y="62" text-anchor="middle">layer 1</text><rect class="blue-soft" x="155" y="30" width="39" height="42"/><rect class="panel" x="550" y="30" width="39" height="42"/><rect class="blue-soft" x="198" y="30" width="39" height="42"/><rect class="panel" x="593" y="30" width="39" height="42"/><rect class="blue-soft" x="241" y="30" width="39" height="42"/><rect class="panel" x="636" y="30" width="39" height="42"/><rect class="blue-soft" x="284" y="30" width="39" height="42"/><rect class="panel" x="679" y="30" width="39" height="42"/><rect class="blue-soft" x="327" y="30" width="39" height="42"/><rect class="panel" x="722" y="30" width="39" height="42"/><rect class="blue-soft" x="370" y="30" width="39" height="42"/><rect class="panel" x="765" y="30" width="39" height="42"/><text class="label" x="125" y="57" text-anchor="middle">K</text><text class="label" x="520" y="57" text-anchor="middle">V</text><text class="label" x="70" y="127" text-anchor="middle">layer 2</text><rect class="blue-soft" x="155" y="95" width="39" height="42"/><rect class="panel" x="550" y="95" width="39" height="42"/><rect class="blue-soft" x="198" y="95" width="39" height="42"/><rect class="panel" x="593" y="95" width="39" height="42"/><rect class="blue-soft" x="241" y="95" width="39" height="42"/><rect class="panel" x="636" y="95" width="39" height="42"/><rect class="blue-soft" x="284" y="95" width="39" height="42"/><rect class="panel" x="679" y="95" width="39" height="42"/><rect class="blue-soft" x="327" y="95" width="39" height="42"/><rect class="panel" x="722" y="95" width="39" height="42"/><rect class="blue-soft" x="370" y="95" width="39" height="42"/><rect class="panel" x="765" y="95" width="39" height="42"/><text class="label" x="125" y="122" text-anchor="middle">K</text><text class="label" x="520" y="122" text-anchor="middle">V</text><text class="small" x="70" y="155" text-anchor="middle">⋮</text><text class="label" x="70" y="192" text-anchor="middle">layer L</text><rect class="blue-soft" x="155" y="160" width="39" height="42"/><rect class="panel" x="550" y="160" width="39" height="42"/><rect class="blue-soft" x="198" y="160" width="39" height="42"/><rect class="panel" x="593" y="160" width="39" height="42"/><rect class="blue-soft" x="241" y="160" width="39" height="42"/><rect class="panel" x="636" y="160" width="39" height="42"/><rect class="blue-