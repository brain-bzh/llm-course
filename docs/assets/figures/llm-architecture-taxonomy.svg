<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
  <title id="title">Transformer language-model families</title>
  <desc id="desc">Encoder-only models map input to representations. Encoder-decoder models connect an encoder to a decoder. Decoder-only models map causal context to the next token.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#68798a"/></marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.panel{fill:#f3f7fa;stroke:#d8e2e8;stroke-width:2}.core{fill:#10233f;stroke:#10233f;stroke-width:2}.accent{fill:#e2f4f4;stroke:#007f86;stroke-width:2}.flow{fill:none;stroke:#68798a;stroke-width:3;marker-end:url(#arrow)}.heading{fill:#10233f;font-size:20px;font-weight:700}.label{fill:#10233f;font-size:17px;font-weight:700}.inverse{fill:#fff;font-size:16px;font-weight:700}
      @media(prefers-color-scheme:dark){.panel{fill:#182534;stroke:#2c4052}.core{fill:#2c4052;stroke:#54d2d8}.accent{fill:#173b40;stroke:#54d2d8}.heading,.label{fill:#f3f7fa}}
    </style>
  </defs>
  <rect class="panel" x="18" y="20" width="218" height="252" rx="14"/><text class="heading" x="127" y="55" text-anchor="middle">Encoder-only</text>
  <rect class="core" x="52" y="91" width="150" height="58" rx="8"/><text class="inverse" x="127" y="115" text-anchor="middle">Bidirectional</text><text class="inverse" x="127" y="137" text-anchor="middle">attention</text>
  <path class="flow" d="M127 149V179"/><rect class="accent" x="52" y="183" width="150" height="52" rx="8"/><text class="label" x="127" y="215" text-anchor="middle">Representation</text>

  <rect class="panel" x="251" y="20" width="218" height="252" rx="14"/><text class="heading" x="360" y="55" text-anchor="middle">Encoder–decoder</text>
  <rect class="core" x="272" y="104" width="76" height="58" rx="8"/><text class="inverse" x="310" y="139" text-anchor="middle">Encoder</text>
  <path class="flow" d="M348 133H368"/><rect class="core" x="372" y="104" width="76" height="58" rx="8"/><text class="inverse" x="410" y="139" text-anchor="middle">Decoder</text>
  <text class="label" x="360" y="207" text-anchor="middle">Cross-attention</text>

  <rect class="panel" x="484" y="20" width="218" height="252" rx="14"/><text class="heading" x="593" y="55" text-anchor="middle">Decoder-only</text>
  <rect class="core" x="518" y="91" width="150" height="58" rx="8"/><text class="inverse" x="593" y="115" text-anchor="middle">Causal</text><text class="inverse" x="593" y="137" text-anchor="middle">attention</text>
  <path class="flow" d="M593 149V179"/><rect class="accent" x="518" y="183" width="150" height="52" rx="8"/><text class="label" x="593" y="215" text-anchor="middle">Next token</text>
</svg>
