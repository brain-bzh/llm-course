<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="title desc"><title id="title">Paged key-value block mapping</title><desc id="desc">Ten tokens fill two blocks and half a third, mapped from logical blocks zero, one and two to physical blocks four, one and six. The last block has two unused token slots.</desc><defs><marker id="arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="6" markerHeight="5" orient="auto"><path d="M0 0L10 4L0 8z" fill="#667b8c"/></marker><marker id="purple" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="6" markerHeight="5" orient="auto"><path d="M0 0L10 4L0 8z" fill="#704cb2"/></marker><style>text{font-family:Inter,system-ui,sans-serif;fill:#173452;font-size:19px}.rank{font-size:20px;font-weight:700}.label{font-size:19px;font-weight:650}.small{font-size:16px;fill:#536a7d}.white{fill:#fff;font-weight:650}.panel{fill:#f2f6f9;stroke:#afc3d1;stroke-width:2}.blue{fill:#17406b;stroke:#17406b}.coral{fill:#d4562e;stroke:#d4562e}.blue-soft{fill:#dce7f1;stroke:#17406b}.coral-soft{fill:#f7e1d9;stroke:#b8481f}.absent{fill:none;stroke:#91a3b0;stroke-width:2;stroke-dasharray:6 5}.comm{fill:#f3effa;stroke:#704cb2;stroke-width:2}.flow{fill:none;stroke:#667b8c;stroke-width:2.5;marker-end:url(#arrow)}.network{fill:none;stroke:#704cb2;stroke-width:3;marker-end:url(#purple)}@media(prefers-color-scheme:dark){text{fill:#edf5fb}.small{fill:#c3d4df}.panel{fill:#263b4b;stroke:#7690a2}.blue-soft{fill:#294a68;stroke:#80b5d7}.coral-soft{fill:#654238;stroke:#f0a88c}.absent{stroke:#9bb0bf}.comm{fill:#403158;stroke:#c4a6ef}.flow{stroke:#b1c3d1}.network{stroke:#c4a6ef}}</style></defs><text class="label" x="105" y="42" text-anchor="middle">Logical blocks</text><rect class="blue-soft" x="240" y="15" width="145" height="70"/><text class="label" x="312.5" y="44" text-anchor="middle">logical 0</text><text class="small" x="312.5" y="68" text-anchor="middle">tokens 0–3</text><rect class="blue-soft" x="440" y="15" width="145" height="70"/><text class="label" x="512.5" y="44" text-anchor="middle">logical 1</text><text class="small" x="512.5" y="68" text-anchor="middle">tokens 4–7</text><rect class="blue-soft" x="640" y="15" width="145" height="70"/><text class="label" x="712.5" y="44" text-anchor="middle">logical 2</text><text class="small" x="712.5" y="68" text-anchor="middle">tokens 8–9</text><text class="label" x="102" y="185" text-anchor="middle">Block table</text><text class="label" x="480" y="185" text-anchor="middle">0 → 4   ·   1 → 1   ·   2 → 6</text><text class="label" x="100" y="260" text-anchor="middle">Physical pool</text><rect class="panel" x="215" y="225" width="82" height="62"/><text class="label" x="256" y="263" text-anchor="middle">0</text><rect class="comm" x="315" y="225" width="82" height="62"/><text class="label" x="356" y="263" text-anchor="middle">1</text><rect class="panel" x="415" y="225" width="82" height="62"/><text class="label" x="456" y="263" text-anchor="middle">2</text><rect class="panel" x="515" y="225" width="82" height="62"/><text class="label" x="556" y="263" text-anchor="middle">3</text><rect class="comm" x="615" y="225" width="82" height="62"/><text class="label" x="656" y="263" text-anchor="middle">4</text><rect class="panel" x="715" y="225" width="82" height="62"/><text class="label" x="756" y="263" text-anchor="middle">5</text><rect class="comm" x="815" y="225" width="82" height="62"/><text class="label" x="856" y="263" text-anchor="middle">6</text><text class="small" x="480" y="331" text-anchor="middle">4 slots per block · 10 tokens · last block has 2 unused slots</text></svg>
