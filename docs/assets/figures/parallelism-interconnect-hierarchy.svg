<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 250" role="img" aria-labelledby="title desc">
  <title id="title">Mapping Parallelism Dimensions to Interconnects</title>
  <desc id="desc">Tensor and Context Parallelism require ultra-low latency NVLink within a node. Pipeline, Data, and FSDP parallelism tolerate inter-node network fabrics.</desc>
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" refX="8.5" refY="4" markerWidth="3.8" markerHeight="3.0" orient="auto">
      <path d="M0 1L8.5 4L0 7z" fill="#68798a"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .bg { fill: #f8fafc; stroke: #d8e2e8; stroke-width: 2; rx: 14; }
      .panel-title { fill: #10233f; font-size: 13.5px; font-weight: 750; }
      .rank-lbl { fill: #526071; font-size: 12px; font-weight: 650; }
      .cell-text { fill: #10233f; font-size: 12px; font-weight: 750; text-anchor: middle; }
      .cell-text-sm { fill: #10233f; font-size: 11px; font-weight: 750; text-anchor: middle; }
      .cell-border { stroke: #ffffff; stroke-width: 1.5; }
      .empty-slot { fill: #eef2f6; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 3 3; rx: 4; }
      .empty-text { fill: #94a3b8; font-size: 11px; font-weight: 500; text-anchor: middle; }
      .c0 { fill: #54c6cd; }
      .c1 { fill: #f59e0b; }
      .c2 { fill: #c084fc; }
      .c3 { fill: #fb7185; }
      .c0-light { fill: #bdecee; }
      .c1-light { fill: #fde68a; }
      .c2-light { fill: #e9d5ff; }
      .c3-light { fill: #fecdd3; }
      .flow { fill: none; stroke: #68798a; stroke-width: 2.5; marker-end: url(#arrow); }
      .api-lbl { fill: #007f86; font-size: 13px; font-weight: 700; text-anchor: middle; font-family: 'JetBrains Mono', monospace; }
      .meta-lbl { fill: #64748b; font-size: 11px; font-weight: 600; text-anchor: middle; }
      .meta-cost { fill: #ea580c; font-size: 11px; font-weight: 700; text-anchor: middle; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #131d2a; stroke: #2c4052; }
        .panel-title { fill: #f3f7fa; }
        .rank-lbl { fill: #94a3b8; }
        .cell-border { stroke: #131d2a; }
        .empty-slot { fill: #1e293b; stroke: #334155; }
        .empty-text { fill: #64748b; }
        .cell-text, .cell-text-sm { fill: #10233f; }
        .flow { stroke: #94a3b8; }
        .api-lbl { fill: #54d2d8; }
        .meta-lbl { fill: #94a3b8; }
        .meta-cost { fill: #fb923c; }
      }
    </style>
  </defs>
  <!-- Main Container -->
  <rect class="bg" x="15" y="15" width="830" height="220"/>
  <text class="panel-title" x="35" y="42">Hardware Interconnect Bandwidth &amp; Parallelism Mapping</text>

  <!-- Left: NVLink -->
  <rect class="c0-light" x="35" y="60" width="250" height="155" rx="10" style="fill-opacity: 0.25; stroke: #007f86; stroke-width: 1.5;"/>
  <text class="api-lbl" x="160" y="84">NVLink 4 / 5 Mesh</text>
  <text class="meta-lbl" x="160" y="104">450–900 GB/s · &lt; 1 µs latency</text>
  <text class="meta-cost" x="160" y="122">Intra-Node (up to 8 GPUs)</text>

  <rect class="c0 cell-border" x="55" y="136" width="100" height="28" rx="6"/><text class="cell-text" x="105" y="155">TP</text>
  <rect class="c0 cell-border" x="165" y="136" width="100" height="28" rx="6"/><text class="cell-text" x="215" y="155">CP</text>
  <text class="meta-lbl" x="160" y="186">Frequent per-layer All-Reduce</text>
  <text class="meta-lbl" x="160" y="202">&amp; online-softmax ring circulation</text>

  <!-- Arrow Left to Right -->
  <path class="flow" d="M295 137 H320"/>

  <!-- Middle: PCIe / Scale-Up -->
  <rect class="c1-light" x="330" y="60" width="210" height="155" rx="10" style="fill-opacity: 0.25; stroke: #ea580c; stroke-width: 1.5;"/>
  <text class="api-lbl" x="435" y="84" style="fill: #ea580c;">PCIe Gen 5 / NVSwitch</text>
  <text class="meta-lbl" x="435" y="104">64 GB/s · ~2–5 µs latency</text>
  <text class="meta-cost" x="435" y="122">Scale-Up Domain / Rack</text>

  <rect class="c1 cell-border" x="385" y="136" width="100" height="28" rx="6"/><text class="cell-text" x="435" y="155">EP</text>
  <text class="meta-lbl" x="435" y="186">All-to-All token dispatch</text>
  <text class="meta-lbl" x="435" y="202">&amp; combine across experts</text>

  <!-- Arrow Middle to Right -->
  <path class="flow" d="M550 137 H575"/>

  <!-- Right: InfiniBand / Network -->
  <rect class="c2-light" x="585" y="60" width="240" height="155" rx="10" style="fill-opacity: 0.25; stroke: #7c3aed; stroke-width: 1.5;"/>
  <text class="api-lbl" x="705" y="84" style="fill: #7c3aed;">InfiniBand / RoCE</text>
  <text class="meta-lbl" x="705" y="104">25–100 GB/s · 5–15 µs latency</text>
  <text class="meta-cost" x="705" y="122">Inter-Node Fabric (Cluster)</text>

  <rect class="c2 cell-border" x="600" y="136" width="65" height="28" rx="6"/><text class="cell-text" x="632" y="155">PP</text>
  <rect class="c2 cell-border" x="673" y="136" width="65" height="28" rx="6"/><text class="cell-text" x="705" y="155">DP</text>
  <rect class="c2 cell-border" x="745" y="136" width="65" height="28" rx="6"/><text class="cell-text" x="777" y="155">FSDP</text>
  <text class="meta-lbl" x="705" y="186">Step-boundary gradient sync</text>
  <text class="meta-lbl" x="705" y="202">&amp; async compute overlap</text>
</svg>