<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">Ring attention keeps queries local and rotates key-value blocks</title>
  <desc id="desc">Four context-parallel ranks keep local query blocks while key-value blocks circulate around a ring. Each round updates online softmax state, and after four rounds every query block has seen the full context.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#007f86"/></marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.rank{fill:#f3f7fa;stroke:#d8e2e8;stroke-width:2}.q{fill:#10233f}.kv0{fill:#54c6cd}.kv1{fill:#f59e0b}.kv2{fill:#c084fc}.kv3{fill:#fb7185}.ring{fill:none;stroke:#007f86;stroke-width:4;marker-end:url(#arrow)}.label{fill:#10233f;font-size:17px;font-weight:750}.sub{fill:#526071;font-size:13px;font-weight:500}.inverse{fill:#fff;font-size:15px;font-weight:750}.round{fill:#e2f4f4;stroke:#007f86;stroke-width:2}.equation{fill:#007f86;font-size:16px;font-weight:750}
      @media(prefers-color-scheme:dark){.rank{fill:#182534;stroke:#2c4052}.label{fill:#f3f7fa}.sub{fill:#9fb2c4}.ring{stroke:#54d2d8}.round{fill:#173b40;stroke:#54d2d8}.equation{fill:#54d2d8}}
    </style>
  </defs>
  <text class="label" x="35" y="35">One round: Q stays; K,V move</text>
  <path class="ring" d="M480 92H720V222"/><path class="ring" d="M720 222V350H480"/><path class="ring" d="M480 350H240V222"/><path class="ring" d="M240 222V92H480"/>
  <g><rect class="rank" x="394" y="60" width="172" height="86" rx="13"/><rect class="q" x="410" y="78" width="58" height="46" rx="7"/><text class="inverse" x="439" y="106" text-anchor="middle">Q₀</text><rect class="kv0" x="480" y="78" width="70" height="46" rx="7"/><text class="label" x="515" y="106" text-anchor="middle">KV₀</text><text class="sub" x="480" y="140" text-anchor="middle">rank 0</text></g>
  <g><rect class="rank" x="678" y="179" width="172" height="86" rx="13"/><rect class="q" x="694" y="197" width="58" height="46" rx="7"/><text class="inverse" x="723" y="225" text-anchor="middle">Q₁</text><rect class="kv1" x="764" y="197" width="70" height="46" rx="7"/><text class="label" x="799" y="225" text-anchor="middle">KV₁</text><text class="sub" x="764" y="259" text-anchor="middle">rank 1</text></g>
  <g><rect class="rank" x="394" y="308" width="172" height="86" rx="13"/><rect class="q" x="410" y="326" width="58" height="46" rx="7"/><text class="inverse" x="439" y="354" text-anchor="middle">Q₂</text><rect class="kv2" x="480" y="326" width="70" height="46" rx="7"/><text class="label" x="515" y="354" text-anchor="middle">KV₂</text><text class="sub" x="480" y="388" text-anchor="middle">rank 2</text></g>
  <g><rect class="rank" x="110" y="179" width="172" height="86" rx="13"/><rect class="q" x="126" y="197" width="58" height="46" rx="7"/><text class="inverse" x="155" y="225" text-anchor="middle">Q₃</text><rect class="kv3" x="196" y="197" width="70" height="46" rx="7"/><text class="label" x="231" y="225" text-anchor="middle">KV₃</text><text class="sub" x="196" y="259" text-anchor="middle">rank 3</text></g>
  <rect class="round" x="350" y="186" width="260" height="72" rx="12"/><text class="equation" x="480" y="214" text-anchor="middle">update (m, ℓ, o)</text><text class="sub" x="480" y="238" text-anchor="middle">exact online-softmax state</text>
  <text class="label" x="480" y="440" text-anchor="middle">After C rounds, every local query has attended to all C key-value blocks.</text>
</svg>
