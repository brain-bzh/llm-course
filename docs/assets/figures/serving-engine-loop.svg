<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 285" role="img" aria-labelledby="title desc"><title id="title">One inference engine iteration</title><desc id="desc">Requests wait for scheduling, use KV blocks, run a model step, and have output sampled and streamed. Unfinished requests reenter the scheduler.</desc><defs><marker id="arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="6" markerHeight="5" orient="auto"><path d="M0 0L10 4L0 8z" fill="#667b8c"/></marker><marker id="purple" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="6" markerHeight="5" orient="auto"><path d="M0 0L10 4L0 8z" fill="#704cb2"/></marker><style>text{font-family:Inter,system-ui,sans-serif;fill:#173452;font-size:19px}.rank{font-size:20px;font-weight:700}.label{font-size:19px;font-weight:650}.small{font-size:16px;fill:#536a7d}.white{fill:#fff;font-weight:650}.panel{fill:#f2f6f9;stroke:#afc3d1;stroke-width:2}.blue{fill:#17406b;stroke:#17406b}.coral{fill:#d4562e;stroke:#d4562e}.blue-soft{fill:#dce7f1;stroke:#17406b}.coral-soft{fill:#f7e1d9;stroke:#b8481f}.absent{fill:none;stroke:#91a3b0;stroke-width:2;stroke-dasharray:6 5}.comm{fill:#f3effa;stroke:#704cb2;stroke-width:2}.flow{fill:none;stroke:#667b8c;stroke-width:2.5;marker-end:url(#arrow)}.network{fill:none;stroke:#704cb2;stroke-width:3;marker-end:url(#purple)}@media(prefers-color-scheme:dark){text{fill:#edf5fb}.small{fill:#c3d4df}.panel{fill:#263b4b;stroke:#7690a2}.blue-soft{fill:#294a68;stroke:#80b5d7}.coral-soft{fill:#654238;stroke:#f0a88c}.absent{stroke:#9bb0bf}.comm{fill:#403158;stroke:#c4a6ef}.flow{stroke:#b1c3d1}.network{stroke:#c4a6ef}}</style></defs><rect class="panel" x="20" y="35" width="165" height="70"/><text class="label" x="102.5" y="64" text-anchor="middle">waiting</text><text class="small" x="102.5" y="88" text-anchor="middle">requests</text><rect class="panel" x="235" y="35" width="165" height="70"/><text class="label" x="317.5" y="64" text-anchor="middle">scheduler</text><text class="small" x="317.5" y="88" text-anchor="middle">choose tokens</text><rect class="panel" x="450" y="35" width="165" height="70"/><text class="label" x="532.5" y="64" text-anchor="middle">model runner</text><text class="small" x="532.5" y="88" text-anchor="middle">GPU iteration</text><rect class="panel" x="665" y="35" width="200" height="70"/><text class="label" x="765.0" y="64" text-anchor="middle">sample / stream</text><text class="small" x="765.0" y="88" text-anchor="middle">update request</text><path class="flow" d="M185 70H230"/><path class="flow" d="M400 70H445"/><path class="flow" d="M615 70H660"/><rect class="comm" x="345" y="180" width="220" height="70"/><text class="label" x="455.0" y="209" text-anchor="middle">KV manager</text><text class="small" x="455.0" y="233" text-anchor="middle">allocate / free</text><path class="network" d="M318 105 V145 H375 V175"/><path class="network" d="M535 175 V145 H530 V110"/><path class="flow" d="M765 105 V260 H318 V110"/><text class="small" x="670" y="250" text-anchor="middle">unfinished requests return</text></svg>
