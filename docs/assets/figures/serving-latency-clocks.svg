<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="title desc"><title id="title">A streaming request has several latency clocks</title><desc id="desc">A request arrives, is admitted, emits first and subsequent tokens, and finishes. Queue time runs from arrival to admission, TTFT to first token, ITL between adjacent tokens, and end-to-end from arrival to finish.</desc><defs><marker id="arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="6" markerHeight="5" orient="auto"><path d="M0 0L10 4L0 8z" fill="#667b8c"/></marker><marker id="purple" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="6" markerHeight="5" orient="auto"><path d="M0 0L10 4L0 8z" fill="#704cb2"/></marker><style>text{font-family:Inter,system-ui,sans-serif;fill:#173452;font-size:19px}.rank{font-size:20px;font-weight:700}.label{font-size:19px;font-weight:650}.small{font-size:16px;fill:#536a7d}.white{fill:#fff;font-weight:650}.panel{fill:#f2f6f9;stroke:#afc3d1;stroke-width:2}.blue{fill:#17406b;stroke:#17406b}.coral{fill:#d4562e;stroke:#d4562e}.blue-soft{fill:#dce7f1;stroke:#17406b}.coral-soft{fill:#f7e1d9;stroke:#b8481f}.absent{fill:none;stroke:#91a3b0;stroke-width:2;stroke-dasharray:6 5}.comm{fill:#f3effa;stroke:#704cb2;stroke-width:2}.flow{fill:none;stroke:#667b8c;stroke-width:2.5;marker-end:url(#arrow)}.network{fill:none;stroke:#704cb2;stroke-width:3;marker-end:url(#purple)}@media(prefers-color-scheme:dark){text{fill:#edf5fb}.small{fill:#c3d4df}.panel{fill:#263b4b;stroke:#7690a2}.blue-soft{fill:#294a68;stroke:#80b5d7}.coral-soft{fill:#654238;stroke:#f0a88c}.absent{stroke:#9bb0bf}.comm{fill:#403158;stroke:#c4a6ef}.flow{stroke:#b1c3d1}.network{stroke:#c4a6ef}}@media(prefers-color-scheme:dark){.time-ttft{stroke:#8fbce4}.time-queue{stroke:#77d8d2}.time-itl{stroke:#f0a78a}.time-e2e{stroke:#c4a6ef}}</style></defs><path d="M70 100H900" stroke="#62798a" stroke-width="3" marker-end="url(#arrow)"/><path d="M80 90V110" stroke="#62798a" stroke-width="2"/><text class="small" x="80" y="72" text-anchor="middle">arrival</text><path d="M250 90V110" stroke="#62798a" stroke-width="2"/><text class="small" x="250" y="72" text-anchor="middle">admit</text><path d="M510 90V110" stroke="#62798a" stroke-width="2"/><text class="small" x="510" y="72" text-anchor="middle">first token</text><path d="M690 90V110" stroke="#62798a" stroke-width="2"/><text class="small" x="690" y="72" text-anchor="middle">second token</text><path d="M850 90V110" stroke="#62798a" stroke-width="2"/><text class="small" x="850" y="72" text-anchor="middle">finish</text><path d="M80 145H250 M80 138V152 M250 138V152" class="time-queue" stroke="#087b80" stroke-width="3"/><text class="small" x="165.0" y="135" text-anchor="middle">queue</text><path d="M80 195H510 M80 188V202 M510 188V202" class="time-ttft" stroke="#17406b" stroke-width="3"/><text class="small" x="295.0" y="185" text-anchor="middle">TTFT</text><path d="M510 245H690 M510 238V252 M690 238V252" class="time-itl" stroke="#b8481f" stroke-width="3"/><text class="small" x="600.0" y="235" text-anchor="middle">ITL</text><path d="M80 295H850 M80 288V302 M850 288V302" class="time-e2e" stroke="#704cb2" stroke-width="3"/><text class="small" x="465.0" y="285" text-anchor="middle">end-to-end</text></svg>
