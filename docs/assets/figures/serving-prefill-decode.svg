<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 275" role="img" aria-labelledby="title desc"><title id="title">Prefill samples the first token, then decode continues</title><desc id="desc">Prompt prefill builds the per-layer key-value cache and samples the first output y1. The next decode step consumes y1, updates the cache, and samples y2.</desc><defs><marker id="arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="6" markerHeight="5" orient="auto"><path d="M0 0L10 4L0 8z" fill="#667b8c"/></marker><marker id="purple" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="6" markerHeight="5" orient="auto"><path d="M0 0L10 4L0 8z" fill="#704cb2"/></marker><style>text{font-family:Inter,system-ui,sans-serif;fill:#173452;font-size:19px}.rank{font-size:20px;font-weight:700}.label{font-size:19px;font-weight:650}.small{font-size:16px;fill:#536a7d}.white{fill:#fff;font-weight:650}.panel{fill:#f2f6f9;stroke:#afc3d1;stroke-width:2}.blue{fill:#17406b;stroke:#17406b}.coral{fill:#d4562e;stroke:#d4562e}.blue-soft{fill:#dce7f1;stroke:#17406b}.coral-soft{fill:#f7e1d9;stroke:#b8481f}.absent{fill:none;stroke:#91a3b0;stroke-width:2;stroke-dasharray:6 5}.comm{fill:#f3effa;stroke:#704cb2;stroke-width:2}.flow{fill:none;stroke:#667b8c;stroke-width:2.5;marker-end:url(#arrow)}.network{fill:none;stroke:#704cb2;stroke-width:3;marker-end:url(#purple)}@media(prefers-color-scheme:dark){text{fill:#edf5fb}.small{fill:#c3d4df}.panel{fill:#263b4b;stroke:#7690a2}.blue-soft{fill:#294a68;stroke:#80b5d7}.coral-soft{fill:#654238;stroke:#f0a88c}.absent{stroke:#9bb0bf}.comm{fill:#403158;stroke:#c4a6ef}.flow{stroke:#b1c3d1}.network{stroke:#c4a6ef}}</style></defs><rect class="panel" x="15" y="35" width="150" height="70"/><text class="label" x="90.0" y="64" text-anchor="middle">prompt</text><text class="small" x="90.0" y="88" text-anchor="middle">P tokens</text><rect class="blue-soft" x="205" y="35" width="150" height="70"/><text class="label" x="280.0" y="64" text-anchor="middle">prefill</text><text class="small" x="280.0" y="88" text-anchor="middle">P queries</text><rect class="coral-soft" x="395" y="35" width="120" height="70"/><text class="label" x="455.0" y="64" text-anchor="middle">sample</text><text class="small" x="455.0" y="88" text-anchor="middle">y₁</text><rect class="blue-soft" x="555" y="35" width="150" height="70"/><text class="label" x="630.0" y="64" text-anchor="middle">decode</text><text class="small" x="630.0" y="88" text-anchor="middle">1 query</text><rect class="coral-soft" x="745" y="35" width="120" height="70"/><text class="label" x="805.0" y="64" text-anchor="middle">sample</text><text class="small" x="805.0" y="88" text-anchor="middle">y₂</text><path class="flow" d="M165 70H200"/><path class="flow" d="M355 70H390"/><path class="flow" d="M515 70H550"/><path class="flow" d="M705 70H740"/><rect class="comm" x="315" y="180" width="290" height="70"/><text class="label" x="460.0" y="209" text-anchor="middle">per-layer KV cache</text><text class="small" x="460.0" y="233" text-anchor="middle">prompt → prompt + y₁</text><path class="network" d="M280 105 V155 H345 V175"/><path class="network" d="M575 175 V155 H630 V110"/></svg>
