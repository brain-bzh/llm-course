<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">Speculative decoding draft and verification cycle</title>
  <desc id="desc">A small draft model proposes several tokens cheaply. The target model verifies them in parallel, accepts the matching prefix, samples a correction at the first rejection, and repeats from the longer accepted context.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#68798a"/></marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.context{fill:#10233f}.draft{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.accept{fill:#e2f4f4;stroke:#007f86;stroke-width:2}.reject{fill:#fee2e2;stroke:#dc2626;stroke-width:2}.target{fill:#007f86}.flow{stroke:#68798a;stroke-width:3;fill:none;marker-end:url(#arrow)}.label{fill:#10233f;font-size:18px;font-weight:750}.sub{fill:#526071;font-size:13px;font-weight:500}.inverse{fill:#fff;font-size:17px;font-weight:750}.orange{fill:#ea580c;font-size:15px;font-weight:750}.teal{fill:#007f86;font-size:15px;font-weight:750}.red{fill:#dc2626;font-size:15px;font-weight:750}
      @media(prefers-color-scheme:dark){.draft{fill:#382015;stroke:#fb923c}.accept{fill:#173b40;stroke:#54d2d8}.reject{fill:#3f1d1d;stroke:#f87171}.target{fill:#225a60}.label{fill:#f3f7fa}.sub{fill:#9fb2c4}.orange{fill:#fb923c}.teal{fill:#54d2d8}.red{fill:#f87171}}
    </style>
  </defs>
  <rect class="context" x="35" y="156" width="145" height="78" rx="12"/><text class="inverse" x="107" y="188" text-anchor="middle">accepted</text><text class="inverse" x="107" y="212" text-anchor="middle">context</text>
  <path class="flow" d="M180 195H225"/><rect class="draft" x="230" y="62" width="185" height="76" rx="12"/><text class="orange" x="322" y="92" text-anchor="middle">small draft model</text><text class="sub" x="322" y="115" text-anchor="middle">proposes γ tokens cheaply</text>
  <g><rect class="draft" x="235" y="170" width="54" height="52" rx="8"/><text class="label" x="262" y="202" text-anchor="middle">d₁</text><rect class="draft" x="297" y="170" width="54" height="52" rx="8"/><text class="label" x="324" y="202" text-anchor="middle">d₂</text><rect class="draft" x="359" y="170" width="54" height="52" rx="8"/><text class="label" x="386" y="202" text-anchor="middle">d₃</text></g>
  <path class="flow" d="M415 195H475"/><rect class="target" x="480" y="62" width="205" height="76" rx="12"/><text class="inverse" x="582" y="92" text-anchor="middle">target model</text><text class="inverse" x="582" y="115" text-anchor="middle">verifies one block</text>
  <g><rect class="accept" x="485" y="170" width="54" height="52" rx="8"/><text class="teal" x="512" y="202" text-anchor="middle">✓</text><rect class="accept" x="547" y="170" width="54" height="52" rx="8"/><text class="teal" x="574" y="202" text-anchor="middle">✓</text><rect class="reject" x="609" y="170" width="54" height="52" rx="8"/><text class="red" x="636" y="202" text-anchor="middle">×</text></g>
  <path class="flow" d="M685 195H745"/><rect class="accept" x="750" y="147" width="195" height="96" rx="12"/><text class="teal" x="847" y="177" text-anchor="middle">commit matching prefix</text><text class="label" x="847" y="202" text-anchor="middle">d₁, d₂ + correction</text><text class="sub" x="847" y="225" text-anchor="middle">then draft again</text>
  <text class="label" x="490" y="305" text-anchor="middle">One expensive target step can commit several output tokens.</text>
  <rect class="draft" x="165" y="340" width="650" height="58" rx="10"/><text class="label" x="490" y="365" text-anchor="middle">Speedup condition</text><text class="sub" x="490" y="385" text-anchor="middle">high acceptance rate + cheap drafting + efficient block verification</text>
</svg>
