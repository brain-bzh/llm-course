<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" height="auto" role="img" aria-labelledby="title desc">
  <title id="title">Tokenizer fidelity and efficiency trade-offs</title>
  <desc id="desc">A tokenizer must first preserve the input exactly. Moving from fine to coarse tokens lowers tokens per byte but makes each token harder to predict. Bits per byte combines tokens per byte and bits per token.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#68798a"/></marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .gate{fill:#10233f}
      .fine{fill:#e2f4f4;stroke:#007f86;stroke-width:2}
      .coarse{fill:#fff7ed;stroke:#ea580c;stroke-width:2}
      .axis{stroke:#68798a;stroke-width:3;marker-end:url(#arrow)}
      .teal{stroke:#007f86;stroke-width:4.5;fill:none}
      .orange{stroke:#ea580c;stroke-width:4.5;fill:none}
      .label{fill:#10233f;font-size:17px;font-weight:750}
      .sub{fill:#526071;font-size:13px;font-weight:500}
      .inverse{fill:#fff;font-size:18px;font-weight:750}
      .tealtext{fill:#007f86;font-size:16px;font-weight:750}
      .orangetext{fill:#ea580c;font-size:16px;font-weight:750}
      .formula{fill:#10233f;font-size:21px;font-weight:750}
      @media(prefers-color-scheme:dark){
        .gate{fill:#172636;stroke:#2c4052;stroke-width:1}
        .fine{fill:#173b40;stroke:#54d2d8}
        .coarse{fill:#382015;stroke:#fb923c}
        .label,.formula{fill:#f3f7fa}
        .sub{fill:#9fb2c4}
        .teal,.axis{stroke:#54d2d8}
        .orange{stroke:#fb923c}
        .tealtext{fill:#54d2d8}
        .orangetext{fill:#fb923c}
      }
    </style>
  </defs>

  <!-- Fidelity Requirement Gate -->
  <rect class="gate" x="35" y="28" width="890" height="64" rx="12"/>
  <text class="inverse" x="480" y="56" text-anchor="middle">Fidelity gate: decode(encode(text)) = text</text>
  <text class="sub" x="480" y="78" text-anchor="middle" fill="#c5d3e0">Lossless round-trip: whitespace, code, emoji, URLs and every UTF-8 byte must survive</text>

  <!-- Curve Labels (50px clearance above curves) -->
  <text class="tealtext" x="250" y="145" text-anchor="middle">tokens per byte decreases ↓</text>
  <text class="orangetext" x="710" y="145" text-anchor="middle">bits per token increases ↑</text>

  <!-- Trade-off Curves -->
  <path class="teal" d="M160 180C360 215 600 265 800 280"/>
  <path class="orange" d="M160 280C360 265 600 215 800 180"/>

  <!-- Fine and Coarse Anchor Boxes (50px below curves) -->
  <rect class="fine" x="85" y="330" width="180" height="60" rx="10"/>
  <text class="label" x="175" y="356" text-anchor="middle">bytes / characters</text>
  <text class="sub" x="175" y="376" text-anchor="middle">long sequences</text>

  <rect class="coarse" x="695" y="330" width="180" height="60" rx="10"/>
  <text class="label" x="785" y="356" text-anchor="middle">large subwords</text>
  <text class="sub" x="785" y="376" text-anchor="middle">large vocabulary</text>

  <!-- Coarseness Axis -->
  <line class="axis" x1="115" y1="416" x2="855" y2="416"/>
  <text class="label" x="175" y="438" text-anchor="middle">fine units</text>
  <text class="sub" x="480" y="436" text-anchor="middle">vocabulary coarseness →</text>
  <text class="label" x="785" y="438" text-anchor="middle">coarse units</text>

  <!-- Combined Evaluation Formula -->
  <text class="formula" x="480" y="482" text-anchor="middle">bits / byte = (bits / token) × (tokens / byte)</text>
</svg>
