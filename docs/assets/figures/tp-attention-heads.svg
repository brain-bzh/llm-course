<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
<title id="title">Tensor-parallel attention heads</title><desc id="desc">For ordinary four-head attention on two GPUs, each GPU computes two heads for the same tokens, followed by a row-parallel output projection and all-reduce.</desc>
<defs><marker id="arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="6" markerHeight="5" orient="auto"><path d="M0 0L10 4L0 8z" fill="#667b8c"/></marker><marker id="purple" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="6" markerHeight="5" orient="auto"><path d="M0 0L10 4L0 8z" fill="#704cb2"/></marker><style>text{font-family:Inter,system-ui,sans-serif;fill:#173452;font-size:19px}.rank{font-size:20px;font-weight:700}.label{font-size:19px;font-weight:650}.small{font-size:16px;fill:#536a7d}.white{fill:#fff;font-weight:650}.panel{fill:#f2f6f9;stroke:#afc3d1;stroke-width:2}.blue{fill:#17406b;stroke:#17406b}.coral{fill:#b8481f;stroke:#b8481f}.blue-soft{fill:#dce7f1;stroke:#17406b}.coral-soft{fill:#f7e1d9;stroke:#b8481f}.absent{fill:none;stroke:#91a3b0;stroke-width:2;stroke-dasharray:6 5}.comm{fill:#f3effa;stroke:#704cb2;stroke-width:2}.flow{fill:none;stroke:#667b8c;stroke-width:2.5;marker-end:url(#arrow)}.network{fill:none;stroke:#704cb2;stroke-width:3;marker-end:url(#purple)}@media(prefers-color-scheme:dark){text{fill:#edf5fb}.small{fill:#c3d4df}.panel{fill:#263b4b;stroke:#7690a2}.blue-soft{fill:#294a68;stroke:#80b5d7}.coral-soft{fill:#654238;stroke:#f0a88c}.absent{stroke:#9bb0bf}.comm{fill:#403158;stroke:#c4a6ef}.flow{stroke:#b1c3d1}.network{stroke:#c4a6ef}}</style></defs>
<text class="rank" x="28" y="72" text-anchor="start">GPU 0</text><rect class="panel" x="140" y="35" width="105" height="60"/><text class="label" x="192" y="72" text-anchor="middle">X</text><rect class="blue" x="280" y="35" width="150" height="60"/><text class="white" x="355" y="72" text-anchor="middle">local Q, K, V</text><rect class="blue" x="465" y="35" width="145" height="60"/><text class="white" x="537" y="72" text-anchor="middle">heads 0, 1</text><rect class="panel" x="645" y="35" width="145" height="60"/><text class="label" x="717" y="72" text-anchor="middle">partial Z0</text><path class="flow" d="M245 65H275"/><path class="flow" d="M430 65H460"/><path class="flow" d="M610 65H640"/><text class="rank" x="28" y="222" text-anchor="start">GPU 1</text><rect class="panel" x="140" y="185" width="105" height="60"/><text class="label" x="192" y="222" text-anchor="middle">X</text><rect class="coral" x="280" y="185" width="150" height="60"/><text class="white" x="355" y="222" text-anchor="middle">local Q, K, V</text><rect class="coral" x="465" y="185" width="145" height="60"/><text class="white" x="537" y="222" text-anchor="middle">heads 2, 3</text><rect class="panel" x="645" y="185" width="145" height="60"/><text class="label" x="717" y="222" text-anchor="middle">partial Z1</text><path class="flow" d="M245 215H275"/><path class="flow" d="M430 215H460"/><path class="flow" d="M610 215H640"/><path class="network" d="M790 65 H825 V130"/><path class="network" d="M790 215 H825 V170"/><rect class="comm" x="815" y="130" width="125" height="60"/><text class="small" x="877" y="155" text-anchor="middle">all-reduce</text><text class="small" x="877" y="179" text-anchor="middle">Z₀ + Z₁</text>
</svg>
