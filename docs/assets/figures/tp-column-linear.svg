<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
<title id="title">Column-parallel linear layer</title><desc id="desc">Each GPU uses the same input and one column shard of W to compute distinct output features without a forward collective.</desc>
<defs><marker id="arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="6" markerHeight="5" orient="auto"><path d="M0 0L10 4L0 8z" fill="#667b8c"/></marker><marker id="purple" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="6" markerHeight="5" orient="auto"><path d="M0 0L10 4L0 8z" fill="#704cb2"/></marker><style>text{font-family:Inter,system-ui,sans-serif;fill:#173452;font-size:19px}.rank{font-size:20px;font-weight:700}.label{font-size:19px;font-weight:650}.small{font-size:16px;fill:#536a7d}.white{fill:#fff;font-weight:650}.panel{fill:#f2f6f9;stroke:#afc3d1;stroke-width:2}.blue{fill:#17406b;stroke:#17406b}.coral{fill:#b8481f;stroke:#b8481f}.blue-soft{fill:#dce7f1;stroke:#17406b}.coral-soft{fill:#f7e1d9;stroke:#b8481f}.absent{fill:none;stroke:#91a3b0;stroke-width:2;stroke-dasharray:6 5}.comm{fill:#f3effa;stroke:#704cb2;stroke-width:2}.flow{fill:none;stroke:#667b8c;stroke-width:2.5;marker-end:url(#arrow)}.network{fill:none;stroke:#704cb2;stroke-width:3;marker-end:url(#purple)}@media(prefers-color-scheme:dark){text{fill:#edf5fb}.small{fill:#c3d4df}.panel{fill:#263b4b;stroke:#7690a2}.blue-soft{fill:#294a68;stroke:#80b5d7}.coral-soft{fill:#654238;stroke:#f0a88c}.absent{stroke:#9bb0bf}.comm{fill:#403158;stroke:#c4a6ef}.flow{stroke:#b1c3d1}.network{stroke:#c4a6ef}}</style></defs>
<text class="rank" x="50" y="100" text-anchor="start">GPU 0</text><rect class="panel" x="155" y="65" width="115" height="64"/><text class="label" x="212" y="105" text-anchor="middle">X</text><text class="label" x="300" y="105" text-anchor="middle">×</text><rect class="blue" x="335" y="50" width="60" height="94"/><rect class="absent" x="395" y="50" width="60" height="94"/><text class="white" x="365" y="104" text-anchor="middle">W0</text><text class="label" x="485" y="105" text-anchor="middle">=</text><rect class="blue" x="520" y="65" width="62" height="64"/><rect class="absent" x="582" y="65" width="62" height="64"/><text class="white" x="551" y="105" text-anchor="middle">Y0</text><text class="small" x="685" y="94" text-anchor="start">same input X</text><text class="small" x="685" y="120" text-anchor="start">left output features</text><text class="rank" x="50" y="265" text-anchor="start">GPU 1</text><rect class="panel" x="155" y="230" width="115" height="64"/><text class="label" x="212" y="270" text-anchor="middle">X</text><text class="label" x="300" y="270" text-anchor="middle">×</text><rect class="absent" x="335" y="215" width="60" height="94"/><rect class="coral" x="395" y="215" width="60" height="94"/><text class="white" x="425" y="269" text-anchor="middle">W1</text><text class="label" x="485" y="270" text-anchor="middle">=</text><rect class="absent" x="520" y="230" width="62" height="64"/><rect class="coral" x="582" y="230" width="62" height="64"/><text class="white" x="613" y="270" text-anchor="middle">Y1</text><text class="small" x="685" y="259" text-anchor="start">same input X</text><text class="small" x="685" y="285" text-anchor="start">right output features</text><text class="label" x="480" y="371" text-anchor="middle">Y = [ XW₀ | XW₁ ]    ·    no forward collective</text>
</svg>
