<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">Column-parallel linear layer on two ranks</title>
  <desc id="desc">Both ranks receive the same input X. Each rank stores one output-column shard of W1 and produces one shard of the hidden activation H.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#68798a"/></marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.lane{fill:#f3f7fa;stroke:#d8e2e8;stroke-width:2}.weight{fill:#10233f;stroke:#10233f;stroke-width:2}.activation{fill:#e2f4f4;stroke:#007f86;stroke-width:2}.flow{fill:none;stroke:#68798a;stroke-width:3;marker-end:url(#arrow)}.bracket{fill:none;stroke:#007f86;stroke-width:2}.rank{fill:#10233f;font-size:21px;font-weight:700}.label{fill:#10233f;font-size:23px;font-weight:700}.inverse{fill:#fff;font-size:20px;font-weight:700}.dim{fill:#526476;font-size:16px;font-weight:500}.note{fill:#007f86;font-size:17px;font-weight:650}
      @media(prefers-color-scheme:dark){.lane{fill:#182534;stroke:#2c4052}.weight{fill:#2c4052;stroke:#54d2d8}.activation{fill:#173b40;stroke:#54d2d8}.rank,.label{fill:#f3f7fa}.dim{fill:#b9c8d5}.note{fill:#54d2d8}.bracket{stroke:#54d2d8}}
    </style>
  </defs>
  <rect class="lane" x="24" y="24" width="440" height="218" rx="14"/>
  <rect class="lane" x="496" y="24" width="440" height="218" rx="14"/>
  <text class="rank" x="50" y="60">Rank 0</text><text class="rank" x="522" y="60">Rank 1</text>
  <rect class="activation" x="50" y="91" width="82" height="66" rx="8"/><text class="label" x="91" y="132" text-anchor="middle">X</text><text class="dim" x="91" y="184" text-anchor="middle">B × d</text>
  <rect class="weight" x="183" y="81" width="116" height="86" rx="8"/><text class="inverse" x="241" y="121" text-anchor="middle">W₁[0]</text><text class="inverse" x="241" y="146" text-anchor="middle">d × m/2</text>
  <rect class="activation" x="350" y="91" width="88" height="66" rx="8"/><text class="label" x="394" y="132" text-anchor="middle">H₀</text><text class="dim" x="394" y="184" text-anchor="middle">B × m/2</text>
  <path class="flow" d="M132 124H179"/><path class="flow" d="M299 124H346"/>
  <rect class="activation" x="522" y="91" width="82" height="66" rx="8"/><text class="label" x="563" y="132" text-anchor="middle">X</text><text class="dim" x="563" y="184" text-anchor="middle">B × d</text>
  <rect class="weight" x="655" y="81" width="116" height="86" rx="8"/><text class="inverse" x="713" y="121" text-anchor="middle">W₁[1]</text><text class="inverse" x="713" y="146" text-anchor="middle">d × m/2</text>
  <rect class="activation" x="822" y="91" width="88" height="66" rx="8"/><text class="label" x="866" y="132" text-anchor="middle">H₁</text><text class="dim" x="866" y="184" text-anchor="middle">B × m/2</text>
  <path class="flow" d="M604 124H651"/><path class="flow" d="M771 124H818"/>
  <path class="bracket" d="M394 211v18h472v-18"/><text class="note" x="630" y="271" text-anchor="middle">output features are partitioned</text>
</svg>
