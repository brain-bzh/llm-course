<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 260" role="img" aria-labelledby="title desc">
<title id="title">Column then row tensor-parallel MLP</title><desc id="desc">Replicated X enters the column-parallel projection. Each GPU applies the activation to its own hidden-feature shard and feeds it to the matching row-parallel weight shard. An all-reduce sums the resulting partial outputs into replicated Y.</desc>
<defs><marker id="arrow" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="7" markerHeight="6" orient="auto"><path d="M0 0L10 4L0 8z" class="arrowhead"/></marker><style>
text{font-family:Inter,system-ui,sans-serif;fill:#173452;font-size:18px;text-anchor:middle;dominant-baseline:middle}.rank{font-size:20px;font-weight:700}.heading{font-size:19px;font-weight:700}.white{fill:#fff;font-weight:600}.muted{fill:#536a7d}.full{fill:#f2f6f9;stroke:#afc3d1;stroke-width:2}.blue{fill:#17406b;stroke:#17406b}.coral{fill:#b8481f;stroke:#b8481f}.absent{fill:none;stroke:#91a3b0;stroke-width:2;stroke-dasharray:6 5}.comm{fill:#f3effa;stroke:#704cb2;stroke-width:2}.partial0{fill:#dce7f1;stroke:#17406b;stroke-width:2}.partial1{fill:#f7e1d9;stroke:#b8481f;stroke-width:2}.arrowhead{fill:#647b8c}.flow{fill:none;stroke:#647b8c;stroke-width:2;marker-end:url(#arrow)}.exchange{fill:none;stroke:#704cb2;stroke-width:2;stroke-dasharray:5 4}
@media(prefers-color-scheme:dark){text{fill:#edf5fb}.muted{fill:#c3d4df}.full{fill:#263b4b;stroke:#91aaba}.partial0{fill:#294a68;stroke:#80b5d7}.partial1{fill:#654238;stroke:#f0a88c}.absent{stroke:#b2c3ce}.comm{fill:#403158;stroke:#c4a6ef}.blue{fill:#1f5388;stroke:#6ea8dc}.arrowhead{fill:#b1c3d1}.flow{stroke:#b1c3d1}.exchange{stroke:#c4a6ef}}
</style></defs>
<text class="heading" x="165" y="28">Replicated input</text><text class="heading" x="385" y="28">Column W₁</text><text class="heading" x="600" y="28">Local φ</text><text class="heading" x="810" y="28">Row W₂</text><text class="heading" x="1000" y="28">Sum</text><text class="rank" x="53" y="98">GPU 0</text><rect class="full" x="120" y="75" width="90" height="46"/><text class="" x="165.0" y="99.0">X</text><rect class="full" x="265" y="75" width="150" height="46"/><text class="" x="340.0" y="99.0">XW₁,₀</text><rect class="blue" x="470" y="75" width="75" height="46"/><text class="white" x="507.5" y="99.0">H₀</text><rect class="absent" x="545" y="75" width="75" height="46"/><text class="muted" x="582.5" y="99.0">H₁</text><rect class="full" x="670" y="75" width="170" height="46"/><text class="" x="755.0" y="99.0">× W₂,₀ → Z₀</text><path class="flow" d="M210 98 L265 98"/><path class="flow" d="M415 98 L470 98"/><path class="flow" d="M620 98 L670 98"/><text class="rank" x="53" y="208">GPU 1</text><rect class="full" x="120" y="185" width="90" height="46"/><text class="" x="165.0" y="209.0">X</text><rect class="full" x="265" y="185" width="150" height="46"/><text class="" x="340.0" y="209.0">XW₁,₁</text><rect class="absent" x="470" y="185" width="75" height="46"/><text class="muted" x="507.5" y="209.0">H₀</text><rect class="coral" x="545" y="185" width="75" height="46"/><text class="white" x="582.5" y="209.0">H₁</text><rect class="full" x="670" y="185" width="170" height="46"/><text class="" x="755.0" y="209.0">× W₂,₁ → Z₁</text><path class="flow" d="M210 208 L265 208"/><path class="flow" d="M415 208 L470 208"/><path class="flow" d="M620 208 L670 208"/><rect class="comm" x="905" y="128" width="145" height="52"/><text class="" x="977.5" y="155.0">all-reduce</text><path class="flow" d="M840 98 L905 143"/><path class="flow" d="M840 208 L905 165"/><text class="muted" x="978" y="203">Y on both GPUs</text>
</svg>
