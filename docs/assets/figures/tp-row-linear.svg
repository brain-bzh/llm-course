<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
<title id="title">Row-parallel linear layer</title><desc id="desc">Each GPU multiplies its input shard by matching weight rows. The full-shape partial outputs are summed and replicated by all-reduce.</desc>
<defs><marker id="arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="6" markerHeight="5" orient="auto"><path d="M0 0L10 4L0 8z" fill="#667b8c"/></marker><marker id="purple" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="6" markerHeight="5" orient="auto"><path d="M0 0L10 4L0 8z" fill="#704cb2"/></marker><style>text{font-family:Inter,system-ui,sans-serif;fill:#173452;font-size:19px}.rank{font-size:20px;font-weight:700}.label{font-size:19px;font-weight:650}.small{font-size:16px;fill:#536a7d}.white{fill:#fff;font-weight:650}.panel{fill:#f2f6f9;stroke:#afc3d1;stroke-width:2}.blue{fill:#17406b;stroke:#17406b}.coral{fill:#b8481f;stroke:#b8481f}.blue-soft{fill:#dce7f1;stroke:#17406b}.coral-soft{fill:#f7e1d9;stroke:#b8481f}.absent{fill:none;stroke:#91a3b0;stroke-width:2;stroke-dasharray:6 5}.comm{fill:#f3effa;stroke:#704cb2;stroke-width:2}.flow{fill:none;stroke:#667b8c;stroke-width:2.5;marker-end:url(#arrow)}.network{fill:none;stroke:#704cb2;stroke-width:3;marker-end:url(#purple)}@media(prefers-color-scheme:dark){text{fill:#edf5fb}.small{fill:#c3d4df}.panel{fill:#263b4b;stroke:#7690a2}.blue-soft{fill:#294a68;stroke:#80b5d7}.coral-soft{fill:#654238;stroke:#f0a88c}.absent{stroke:#9bb0bf}.comm{fill:#403158;stroke:#c4a6ef}.flow{stroke:#b1c3d1}.network{stroke:#c4a6ef}}</style></defs>
<text class="rank" x="35" y="95" text-anchor="start">GPU 0</text><rect class="blue" x="145" y="60" width="75" height="64"/><text class="white" x="182" y="100" text-anchor="middle">X0</text><text class="label" x="248" y="100" text-anchor="middle">×</text><rect class="blue" x="280" y="45" width="115" height="47"/><rect class="absent" x="280" y="92" width="115" height="47"/><text class="white" x="338" y="76" text-anchor="middle">W0</text><text class="label" x="425" y="100" text-anchor="middle">=</text><rect class="blue-soft" x="455" y="60" width="100" height="64"/><text class="label" x="505" y="100" text-anchor="middle">Z0</text><text class="rank" x="35" y="260" text-anchor="start">GPU 1</text><rect class="coral" x="145" y="225" width="75" height="64"/><text class="white" x="182" y="265" text-anchor="middle">X1</text><text class="label" x="248" y="265" text-anchor="middle">×</text><rect class="absent" x="280" y="210" width="115" height="47"/><rect class="coral" x="280" y="257" width="115" height="47"/><text class="white" x="338" y="288" text-anchor="middle">W1</text><text class="label" x="425" y="265" text-anchor="middle">=</text><rect class="coral-soft" x="455" y="225" width="100" height="64"/><text class="label" x="505" y="265" text-anchor="middle">Z1</text><path class="network" d="M555 92 L650 145"/><path class="network" d="M555 257 L650 203"/><rect class="comm" x="650" y="140" width="150" height="68"/><text class="label" x="725" y="167" text-anchor="middle">all-reduce</text><text class="small" x="725" y="191" text-anchor="middle">Z₀ + Z₁</text><path class="network" d="M800 174 H850"/><rect class="panel" x="850" y="142" width="75" height="64"/><text class="label" x="888" y="182" text-anchor="middle">Y</text><text class="small" x="888" y="232" text-anchor="middle">both GPUs</text><text class="small" x="480" y="359" text-anchor="middle">Each Z has the full output shape, but only a partial value.</text>
</svg>
