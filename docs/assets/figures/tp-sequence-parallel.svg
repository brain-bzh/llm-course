<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 255" role="img" aria-labelledby="title desc">
<title id="title">Sequence parallelism between tensor-parallel regions</title><desc id="desc">A reduce-scatter sums partial outputs and partitions tokens. Local operations run on token shards; all-gather restores tokens for the next tensor-parallel region.</desc>
<defs><marker id="arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="6" markerHeight="5" orient="auto"><path d="M0 0L10 4L0 8z" fill="#667b8c"/></marker><marker id="purple" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="6" markerHeight="5" orient="auto"><path d="M0 0L10 4L0 8z" fill="#704cb2"/></marker><style>text{font-family:Inter,system-ui,sans-serif;fill:#173452;font-size:19px}.rank{font-size:20px;font-weight:700}.label{font-size:19px;font-weight:650}.small{font-size:16px;fill:#536a7d}.white{fill:#fff;font-weight:650}.token{font-size:15px}.panel{fill:#f2f6f9;stroke:#afc3d1;stroke-width:2}.blue{fill:#17406b;stroke:#17406b}.coral{fill:#b8481f;stroke:#b8481f}.blue-soft{fill:#dce7f1;stroke:#17406b}.coral-soft{fill:#f7e1d9;stroke:#b8481f}.absent{fill:none;stroke:#91a3b0;stroke-width:2;stroke-dasharray:6 5}.comm{fill:#f3effa;stroke:#704cb2;stroke-width:2}.flow{fill:none;stroke:#667b8c;stroke-width:2.5;marker-end:url(#arrow)}.network{fill:none;stroke:#704cb2;stroke-width:3;marker-end:url(#purple)}@media(prefers-color-scheme:dark){text{fill:#edf5fb}.small{fill:#c3d4df}.token{font-size:15px}.panel{fill:#263b4b;stroke:#7690a2}.blue-soft{fill:#294a68;stroke:#80b5d7}.coral-soft{fill:#654238;stroke:#f0a88c}.absent{stroke:#9bb0bf}.comm{fill:#403158;stroke:#c4a6ef}.flow{stroke:#b1c3d1}.network{stroke:#c4a6ef}}</style></defs>
<rect class="panel" x="20" y="50" width="185" height="78"/><text class="label" x="112.5" y="80" text-anchor="middle">TP output</text><text class="small" x="112.5" y="108" text-anchor="middle">partial values</text><rect class="comm" x="248" y="50" width="190" height="78"/><text class="label" x="343.0" y="80" text-anchor="middle">reduce-scatter</text><text class="small" x="343.0" y="108" text-anchor="middle">sum + split tokens</text><rect class="panel" x="481" y="50" width="195" height="78"/><text class="label" x="578.5" y="80" text-anchor="middle">local operations</text><text class="small" x="578.5" y="108" text-anchor="middle">token shards</text><rect class="comm" x="719" y="50" width="200" height="78"/><text class="label" x="819.0" y="80" text-anchor="middle">all-gather</text><text class="small" x="819.0" y="108" text-anchor="middle">restore tokens</text><path class="network" d="M205 89H243"/><path class="network" d="M438 89H476"/><path class="network" d="M676 89H714"/><rect class="blue" x="488" y="165" width="100" height="42"/><text class="white token" x="538" y="192" text-anchor="middle">tokens 0–1</text><rect class="coral" x="594" y="165" width="100" height="42"/><text class="white token" x="644" y="192" text-anchor="middle">tokens 2–3</text><text class="small" x="538" y="234" text-anchor="middle">GPU 0</text><text class="small" x="644" y="234" text-anchor="middle">GPU 1</text>
</svg>
