<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" role="img" aria-labelledby="title desc">
  <title id="title">Training-Loop Anatomy</title>
  <desc id="desc">Data flow and state transitions in an LLM training loop: micro-batch forward and backward accumulation, gradient clipping, AdamW parameter updates, and gradient reset.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#68798a"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .node { fill: #f3f7fa; stroke: #d8e2e8; stroke-width: 2; }
      .block { fill: #e2f4f4; stroke: #007f86; stroke-width: 2; stroke-dasharray: 6 4; }
      .core { fill: #10233f; stroke: #10233f; stroke-width: 2; }
      .state { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
      .flow { fill: none; stroke: #68798a; stroke-width: 3; marker-end: url(#arrow); }
      .flow-loop { fill: none; stroke: #007f86; stroke-width: 2.5; stroke-dasharray: 4 3; marker-end: url(#arrow); }
      .label { fill: #10233f; font-size: 15px; font-weight: 700; }
      .label-sub { fill: #526071; font-size: 12px; font-weight: 500; }
      .inverse { fill: #ffffff; font-size: 14px; font-weight: 700; }
      .inverse-sub { fill: #c5d3e0; font-size: 12px; font-weight: 500; }
      .repeat { fill: #007f86; font-size: 14px; font-weight: 700; }
      .accent { fill: #ea580c; font-size: 14px; font-weight: 700; }
      .accent-sub { fill: #9a3412; font-size: 11px; font-weight: 500; }
      @media (prefers-color-scheme: dark) {
        .node { fill: #182534; stroke: #2c4052; }
        .block { fill: #173b40; stroke: #54d2d8; }
        .core { fill: #2c4052; stroke: #54d2d8; }
        .state { fill: #382015; stroke: #f97316; }
        .label { fill: #f3f7fa; }
        .label-sub { fill: #9fb2c4; }
        .repeat { fill: #54d2d8; }
        .accent { fill: #fb923c; }
        .accent-sub { fill: #fdba74; }
      }
    </style>
  </defs>

  <!-- Micro-batch accumulation container -->
  <rect class="block" x="15" y="35" width="465" height="235" rx="12"/>
  <text class="repeat" x="247" y="60" text-anchor="middle">Micro-batch Loop (accumulate M steps)</text>

  <!-- Node 1: Batch Loading -->
  <rect class="node" x="35" y="85" width="115" height="70" rx="8"/>
  <text class="label" x="92" y="115" text-anchor="middle">Token Batch</text>
  <text class="label-sub" x="92" y="135" text-anchor="middle">x, y ∈ B × T</text>

  <!-- Flow 1 -> 2 -->
  <path class="flow" d="M150 120H175"/>

  <!-- Node 2: Forward + Loss -->
  <rect class="core" x="175" y="80" width="135" height="80" rx="8"/>
  <text class="inverse" x="242" y="110" text-anchor="middle">Forward &amp; Loss</text>
  <text class="inverse-sub" x="242" y="130" text-anchor="middle">with autocast(bf16)</text>
  <text class="inverse-sub" x="242" y="148" text-anchor="middle">loss = ℒ / M</text>

  <!-- Flow 2 -> 3 -->
  <path class="flow" d="M310 120H335"/>

  <!-- Node 3: Backward accumulation -->
  <rect class="core" x="335" y="80" width="125" height="80" rx="8"/>
  <text class="inverse" x="397" y="110" text-anchor="middle">loss.backward()</text>
  <text class="inverse-sub" x="397" y="132" text-anchor="middle">.grad += ∂ℒ/∂W</text>
  <text class="inverse-sub" x="397" y="148" text-anchor="middle">(additive buffer)</text>

  <!-- Accumulation loop back arrow -->
  <path class="flow-loop" d="M397 160V220H92V155"/>
  <text class="repeat" x="247" y="240" text-anchor="middle">repeat for m = 1 … M - 1</text>

  <!-- Step Boundary Section -->
  <!-- Flow out of Micro-batch loop -->
  <path class="flow" d="M460 120H495"/>

  <!-- Node 4: Gradient Clipping -->
  <rect class="node" x="495" y="85" width="135" height="70" rx="8"/>
  <text class="label" x="562" y="115" text-anchor="middle">Clip Grad Norm</text>
  <text class="label-sub" x="562" y="135" text-anchor="middle">‖g‖₂ ≤ max_norm</text>

  <!-- Flow 4 -> 5 -->
  <path class="flow" d="M630 120H655"/>

  <!-- Node 5: Optimizer Step -->
  <rect class="state" x="655" y="80" width="145" height="80" rx="8"/>
  <text class="accent" x="727" y="110" text-anchor="middle">optimizer.step()</text>
  <text class="accent-sub" x="727" y="130" text-anchor="middle">AdamW: update m, v</text>
  <text class="accent-sub" x="727" y="148" text-anchor="middle">W ← W - η·(m̂/√v̂ + λW)</text>

  <!-- Flow from step to reset -->
  <path class="flow" d="M727 160V220H635"/>

  <!-- Node 6: Reset Gradients & Schedule -->
  <rect class="core" x="495" y="185" width="140" height="70" rx="8"/>
  <text class="inverse" x="565" y="213" text-anchor="middle">zero_grad(set_to_none)</text>
  <text class="inverse-sub" x="565" y="233" text-anchor="middle">+ scheduler.step()</text>

  <!-- Flow back to start of next optimizer step -->
  <path class="flow" d="M495 220H480"/>

  <!-- Bottom Legend / Invariants -->
  <text class="label-sub" x="410" y="305" text-anchor="middle">Invariant: Model weights change ONLY during optimizer.step(). All micro-steps accumulate into .grad buffers.</text>
</svg>
