<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 340" width="100%" height="auto" role="img" aria-labelledby="title desc">
  <title id="title">Training-Loop Anatomy</title>
  <desc id="desc">Data flow and state transitions in an LLM training loop: micro-batch forward and backward accumulation, gradient clipping, AdamW parameter updates, and gradient reset.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10z" class="arrow-head"/>
    </marker>
    <marker id="teal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10z" class="teal-arrow-head"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .node { fill: #f3f7fa; stroke: #d8e2e8; stroke-width: 2; }
      .block { fill: #e2f4f4; stroke: #007f86; stroke-width: 2; stroke-dasharray: 6 4; }
      .core { fill: #10233f; stroke: #10233f; stroke-width: 2; }
      .state { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
      .flow { fill: none; stroke: #68798a; stroke-width: 3; marker-end: url(#arrow); }
      .flow-loop { fill: none; stroke: #007f86; stroke-width: 2.5; stroke-dasharray: 5 4; marker-end: url(#teal-arrow); }
      .label { fill: #10233f; font-size: 15px; font-weight: 700; }
      .label-sub { fill: #526071; font-size: 12px; font-weight: 500; }
      .inverse { fill: #ffffff; font-size: 14px; font-weight: 700; }
      .inverse-sub { fill: #c5d3e0; font-size: 12px; font-weight: 500; }
      .repeat { fill: #007f86; font-size: 14px; font-weight: 700; }
      .accent { fill: #ea580c; font-size: 14px; font-weight: 700; }
      .accent-sub { fill: #9a3412; font-size: 11px; font-weight: 500; }
      .arrow-head { fill: #68798a; }
      .teal-arrow-head { fill: #007f86; }
      @media (prefers-color-scheme: dark) {
        .node { fill: #182534; stroke: #2c4052; }
        .block { fill: #173b40; stroke: #54d2d8; }
        .core { fill: #2c4052; stroke: #54d2d8; }
        .state { fill: #382015; stroke: #f97316; }
        .label { fill: #f3f7fa; }
        .label-sub { fill: #9fb2c4; }
        .repeat { fill: #54d2d8; }
        .accent { fill: #fb923c; }
        .accent-sub { fill: #fdba74; }
        .arrow-head { fill: #9fb2c4; }
        .teal-arrow-head { fill: #54d2d8; }
        .flow { stroke: #9fb2c4; }
        .flow-loop { stroke: #54d2d8; }
      }
    </style>
  </defs>

  <!-- Micro-batch accumulation container -->
  <rect class="block" x="20" y="25" width="550" height="230" rx="12"/>
  <text class="repeat" x="295" y="50" text-anchor="middle">Micro-batch Loop (accumulate M steps)</text>

  <!-- Node 1: Batch Loading -->
  <rect class="node" x="40" y="70" width="135" height="80" rx="8"/>
  <text class="label" x="107.5" y="102" text-anchor="middle">Token Batch</text>
  <text class="label-sub" x="107.5" y="124" text-anchor="middle">x, y ∈ B × T</text>

  <!-- Flow 1 -> 2 -->
  <path class="flow" d="M175 110H214"/>

  <!-- Node 2: Forward + Loss -->
  <rect class="core" x="215" y="70" width="155" height="80" rx="8"/>
  <text class="inverse" x="292.5" y="96" text-anchor="middle">Forward &amp; Loss</text>
  <text class="inverse-sub" x="292.5" y="116" text-anchor="middle">with autocast(bf16)</text>
  <text class="inverse-sub" x="292.5" y="134" text-anchor="middle">loss = ℒ / M</text>

  <!-- Flow 2 -> 3 -->
  <path class="flow" d="M370 110H409"/>

  <!-- Node 3: Backward accumulation -->
  <rect class="core" x="410" y="70" width="145" height="80" rx="8"/>
  <text class="inverse" x="482.5" y="96" text-anchor="middle">loss.backward()</text>
  <text class="inverse-sub" x="482.5" y="116" text-anchor="middle">.grad += ∂ℒ/∂W</text>
  <text class="inverse-sub" x="482.5" y="134" text-anchor="middle">(additive buffer)</text>

  <!-- Accumulation loop back arrow -->
  <path class="flow-loop" d="M482.5 150V205H107.5V156"/>
  <text class="repeat" x="295" y="226" text-anchor="middle">repeat for m = 1 … M − 1</text>

  <!-- Step Boundary Section -->
  <!-- Flow out of Micro-batch loop -->
  <path class="flow" d="M555 110H619"/>
  <text class="repeat" x="594" y="100" text-anchor="middle">m = M</text>

  <!-- Node 4: Gradient Clipping -->
  <rect class="node" x="620" y="70" width="165" height="80" rx="8"/>
  <text class="label" x="702.5" y="102" text-anchor="middle">Clip Grad Norm</text>
  <text class="label-sub" x="702.5" y="124" text-anchor="middle">‖g‖₂ ≤ max_norm</text>

  <!-- Flow 4 -> 5 -->
  <path class="flow" d="M785 110H824"/>

  <!-- Node 5: Optimizer Step -->
  <rect class="state" x="825" y="70" width="175" height="80" rx="8"/>
  <text class="accent" x="912.5" y="96" text-anchor="middle">optimizer.step()</text>
  <text class="accent-sub" x="912.5" y="116" text-anchor="middle">AdamW: update m, v</text>
  <text class="accent-sub" x="912.5" y="134" text-anchor="middle">W ← W − η·(m̂/√v̂ + λW)</text>

  <!-- Flow from step to reset -->
  <path class="flow" d="M912.5 150V210H941"/>

  <!-- Node 6: Reset Gradients & Schedule -->
  <rect class="core" x="640" y="170" width="300" height="80" rx="8"/>
  <text class="inverse" x="790" y="198" text-anchor="middle">zero_grad(set_to_none=True)</text>
  <text class="inverse-sub" x="790" y="219" text-anchor="middle">+ scheduler.step()</text>
  <text class="inverse-sub" x="790" y="237" text-anchor="middle">(reset grad buffers)</text>

  <!-- Flow back to start of next training step -->
  <path class="flow" d="M640 210H590V275H12V110H39"/>
  <text class="label-sub" x="300" y="267" text-anchor="middle">next training step (step += 1)</text>

  <!-- Bottom Legend / Invariants -->
  <text class="label-sub" x="510" y="318" text-anchor="middle">Invariant: Model weights change ONLY during optimizer.step(). All micro-steps accumulate into .grad buffers.</text>
</svg>
