site_name: Training and Scaling Language Models
site_description: From first principles to efficient serving
site_url: https://jonathanlys01.github.io/llm-course/

theme:
  name: material
  favicon: assets/favicon.svg
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Use light mode

nav:
  - Home: index.md
  - Schedule: schedule.md
  - Modules:
      - Overview: modules/index.md
      - 1. Transformer from first principles: modules/01-transformer.md
      - 2. Training-loop anatomy & baseline GPT: modules/02-training-loop.md
      - 3. Pretraining data pipeline: modules/03-data-pipeline.md
      - 4. Single-GPU performance: modules/04-single-gpu.md
      - 5. Distributed data parallelism: modules/05-ddp.md
      - 6. FSDP and ZeRO: modules/06-fsdp.md
      - 7. Tensor parallelism: modules/07-tensor-parallelism.md
      - 8. Context, pipeline & expert parallelism: modules/08-context-pipeline.md
      - 9. KV-cached decoding: modules/09-kv-cache.md
      - 10. Serving systems: modules/10-serving.md
      - 11. Frontier architectures: modules/11-frontier-architectures.md
  - Companion guide:
      - Overview: companion/index.md
      - 1. Inspect & Naive MHA: companion/01-transformer.md
      - 2. Training-loop & baseline GPT: companion/02-training-loop.md
      - 3. Pretraining data pipeline: companion/03-data-pipeline.md
      - 4. Single-GPU performance: companion/04-single-gpu.md
      - 5. Distributed data parallelism: companion/05-ddp.md
      - 6. FSDP and ZeRO: companion/06-fsdp.md
      - 7. Tensor parallelism: companion/07-tensor-parallelism.md
      - 8. Context, pipeline & expert parallelism: companion/08-context-pipeline.md
      - 9. KV-cached decoding: companion/09-kv-cache.md
      - 10. Serving systems: companion/10-serving.md
      - 11. Frontier architectures: companion/11-frontier-architectures.md
  - Continuous project: project.md
  - Reproduction project: reproduction-project.md
  - External material: external-material.md
  - Assessment: assessment.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

hooks:
  - hooks/copy_slides.py

plugins:
  - search

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - assets/stylesheets/extra.css

copyright: 'Training and Scaling Language Models — <a href="https://www.imt-atlantique.fr/en/research-innovation/teams/brain" target="_blank">BRAIN Team</a>, <a href="https://www.imt-atlantique.fr/en" target="_blank">IMT Atlantique</a>'
